        let activeKey = "";

        function openPreview(key) {
            activeKey = key;
            const container = document.getElementById("previewArea");
            container.innerHTML = "";
            let html = ""; let titleText = "";

            if (key.includes('-v')) {
                let parts = key.split('-');
                titleText = `${parts[0]}단원. ${unitTitles[parts[0]][parts[1]-1]} (${parts[0]}-${parts[1]}. 어휘)`;
                document.getElementById('preview-header-title').innerText = titleText;
                let vData = window.vocabDB[key] || [];
                html += generateTitleHtml(titleText, "어휘 Vocabulary", [{p:"", t:`어휘 연습문제 (${vData.length}문항)`}]);
                html += generateVocabHtml(parts[0], parts[1]);
            } else if (key.startsWith('review-')) {
                titleText = `7~9단원 종합 복습 (Workbook)`;
                document.getElementById('preview-header-title').innerText = titleText;
                html += generateTitleHtml(titleText, "종합 복습", []);
                html += generateReviewHtml(key);
            } else {
                let parts = key.split('-');
                titleText = `${parts[0]}단원. ${unitTitles[parts[0]][parts[1]-1]} (${parts[0]}-${parts[1]}. 문법)`;
                document.getElementById('preview-header-title').innerText = titleText;
                let g1 = db[`${parts[0]}-${parts[1]}-1`]; let g2 = db[`${parts[0]}-${parts[1]}-2`];
                let allG = []; if(g1 && g1.g) allG.push(...g1.g); if(g2 && g2.g) allG.push(...g2.g);
                html += generateTitleHtml(titleText, "문법과 표현", allG);
                if(g1) html += generateGrammarHtml(g1, 1);
                if(g2) html += generateGrammarHtml(g2, 2);
            }
            container.innerHTML = html;
            showScreen('preview-screen');
            window.scrollTo(0,0);
        }

        function generateTitleHtml(subtitle, main, gList) {
            let listHtml = gList.map((p, i) => {

            }).join('');
            return `
                <div class="slide-wrapper" id="slide-1">
                    <div class="slide-container" style="border-top: none;">
                        <div class="slide1-layout">
                            <div class="subtitle" id="title-sub" contenteditable="true">${subtitle}</div>
                            <div class="slide1-navy-box"><div class="main-title" id="title-main" contenteditable="true">${main}</div></div>
                            <div class="grammar-points">${listHtml}</div>
                        </div>
                    </div>
                </div>`;
        }

        function generateVocabHtml(u, l) {
            let key = `${u}-${l}-v`;
            let vData = window.vocabDB[key] || [];
            let html = "";
            vData.forEach((item, pIdx) => {
                let wordBankStr = item.b ? item.b.replace(/\n/g, '<br>') : "";
                let qStr = item.q ? item.q.replace(/\n/g, '<br>') : "";
                let bankHtml = wordBankStr ? `<div class="word-bank-box" id="vocab-${u}-${l}-${pIdx}-bank" contenteditable="true">${wordBankStr}</div>` : `<div id="vocab-${u}-${l}-${pIdx}-bank" style="display:none;"></div>`;
                html += `
                    <div class="slide-wrapper" id="slide-vocab-${u}-${l}-${pIdx}">
                        <div class="slide-container">
                            <div class="slide-title" contenteditable="true">어휘 Vocabulary</div>
                            <div class="content-area">
                                <div class="practice-wrapper" style="flex-direction: column; height: 100%; gap: 0;">
                                    ${bankHtml}
                                    <div class="practice-box" id="vocab-${u}-${l}-${pIdx}-q" contenteditable="true" style="width: 100%; height: auto; flex-grow: 1;">${qStr}</div>
                                </div>
                            </div>
                        </div>
                    </div>`;
            });
            return html;
        }

        // ★ 복습 문제 HTML 렌더링 (단어 리스트 표를 1개 단원씩 분리, 듣기/읽기/쓰기/발음 처리)
        function generateReviewHtml(key) {
            let rData = window.reviewDB[key] || [];
            let html = "";
            rData.forEach((item, pIdx) => {
                if(item.isList) {
                    item.content.forEach((unit, uIdx) => {
                        let listHtml = `<div style="font-weight:bold; color:#1e40af; margin-top:15px; margin-bottom:5px; font-size:26px;">[${unit.t}]</div>`;
                        listHtml += `<table class="vocab-grid-table"><tbody>`;
                        let words = unit.words;
                        for(let i=0; i<words.length; i+=4) {
                            listHtml += `<tr>`;
                            listHtml += `<td>☐ ${words[i] || ''}</td>`;
                            listHtml += `<td>${words[i+1] ? '☐ ' + words[i+1] : ''}</td>`;
                            listHtml += `<td>${words[i+2] ? '☐ ' + words[i+2] : ''}</td>`;
                            listHtml += `<td>${words[i+3] ? '☐ ' + words[i+3] : ''}</td>`;
                            listHtml += `</tr>`;
                        }
                        listHtml += `</tbody></table>`;
                        
                        html += `
                        <div class="slide-wrapper" id="slide-review-list-${pIdx}-${uIdx}">
                            <div class="slide-container">
                                <div class="slide-title" contenteditable="true">${item.type}</div>
                                <div class="content-area">
                                    <div class="review-section-title" contenteditable="true">${item.title}</div>
                                    <div class="practice-box" id="review-list-content-${pIdx}-${uIdx}" contenteditable="true" style="font-size:24px; padding:20px; overflow-y:auto;">${listHtml}</div>
                                </div>
                            </div>
                        </div>`;
                    });
                } else if (item.type === "문법") {
                    let rules = item.q.split('\n\n');
                    rules.forEach((rule, rIdx) => {
                        let ruleStr = rule.replace(/\n/g, '<br>');
                        html += `
                        <div class="slide-wrapper" id="slide-review-gram-${pIdx}-${rIdx}">
                            <div class="slide-container">
                                <div class="slide-title" contenteditable="true">${item.type}</div>
                                <div class="content-area">
                                    <div class="review-section-title" contenteditable="true">${item.title}</div>
                                    <div class="practice-box" id="review-gram-content-${pIdx}-${rIdx}" contenteditable="true" style="font-size:24px; padding:20px;">${ruleStr}</div>
                                </div>
                            </div>
                        </div>`;
                    });
                } else {
                    let wordBankStr = item.bank ? item.bank.replace(/\n/g, '<br>') : "";
                    let qStr = item.q ? item.q.replace(/\n/g, '<br>') : "";
                    let bankHtml = wordBankStr ? `<div class="word-bank-box" id="review-${pIdx}-bank" contenteditable="true">${wordBankStr}</div>` : `<div id="review-${pIdx}-bank" style="display:none;"></div>`;
                    
                    html += `
                    <div class="slide-wrapper" id="slide-review-${pIdx}">

                            <div class="slide-title" contenteditable="true">${item.type}</div>
                            <div class="content-area">
                                <div class="review-section-title" contenteditable="true">${item.title}</div>
                                <div class="practice-wrapper" style="flex-direction: column; height: 100%; gap: 0;">
                                    ${bankHtml}
                                    <div class="practice-box" id="review-content-${pIdx}" contenteditable="true" style="width: 100%; height: auto; flex-grow: 1; font-size:20px;">${qStr}</div>
                                </div>
                            </div>
                        </div>
                    </div>`;
                }
            });
            return html;
        }

        function generateGrammarHtml(obj, gIdx) {

                    trs += "<tr>";
                    if(row[0]) {
                        let pos = row[0].p ? `<span class="pos-text">${row[0].p}</span> ` : "";
                        trs += `<td rowspan="${row[0].rs || 1}" id="tbl-${gIdx}-${tIdx}-r${rIdx}-c0" contenteditable="true">${pos}${row[0].t.replace(/\n/g, '<br>')}</td>`;

                                        <tbody>${trs}</tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>`;
            });
            obj.p.forEach((prac, pIdx) => {
                let pracStr = prac.replace(/___/g, '(                                                  )').replace(/\n/g, '<br>');
                html += `
                    <div class="slide-wrapper">

                                </div>
                            </div>

                    </div>`;
            });
            return html;
        }

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 생성 중...'; btn.disabled = true;

            setTimeout(() => {
                try {
                    let pres = new PptxGenJS(); pres.layout = 'LAYOUT_16x9'; 
                    let COLOR_NAVY = "27408B"; let COLOR_BLACK = "000000"; let COLOR_GRAY = "64748B"; let COLOR_BORDER = "CBD5E1";
                    let COLOR_BG_LIGHT = "F8FAFC"; let COLOR_BG_DARK = "E2E8F0"; let FONT_FACE = "맑은 고딕";
                    // 읽기 문제 등 긴 텍스트를 위해 상하좌우 여백을 극단적으로 최소화
                    let X_MARGIN = 0.4; let W_CONTENT = 9.2; 

                    pres.defineSlideMaster({ title: "MASTER_SLIDE", background: { fill: "FFFFFF" }, objects: [{ rect: { x: 0, y: 0, w: "100%", h: 0.1, fill: COLOR_NAVY } }] });
                    function getText(id) { let el = document.getElementById(id); return el ? el.innerText : ""; }
                    function addSlideTitle(slide, textId, customTitle) {
                        let txt = customTitle || getText(textId) || "제목";
                        slide.addText(txt, { x: X_MARGIN, y: 0.3, w: W_CONTENT, h: 0.4, valign: 'bottom', color: COLOR_NAVY, fontSize: 30, bold: true, fontFace: FONT_FACE });
                        slide.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: 0.75, w: W_CONTENT, h: 0.03, fill: COLOR_NAVY });
                    }

                    let slide1 = pres.addSlide();
                    slide1.addText(getText("title-sub"), { x: 4.0, y: 0.3, w: 5.8, align: 'right', color: COLOR_GRAY, fontSize: 24, bold: true, fontFace: FONT_FACE });
                    slide1.addShape(pres.ShapeType.rect, { x: 0, y: 1.9, w: 10, h: 1.2, fill: COLOR_NAVY });
                    slide1.addText(getText("title-main"), { x: 0, y: 1.9, w: 10, h: 1.2, align: 'center', valign: 'middle', color: "FFFFFF", fontSize: 50, bold: true, fontFace: FONT_FACE });
                    let gTextArr = [];
                    for(let i=0; i<10; i++) {
                        let fullText = getText(`title-g-${i}`);
                        if(fullText) {
                            let firstSpace = fullText.indexOf(' ');
                            let pos = firstSpace > -1 ? fullText.substring(0, firstSpace) : fullText;
                            let rest = firstSpace > -1 ? fullText.substring(firstSpace) : "";
                            gTextArr.push({ text: pos + " ", options: { color: COLOR_NAVY, bold: true } });
                            gTextArr.push({ text: rest + "\n", options: { color: COLOR_BLACK, bold: false } });
                        }
                    }
                    if(gTextArr.length > 0) slide1.addText(gTextArr, { x: 0, y: 3.5, w: 10, h: 2.0, align: 'center', valign: 'top', fontSize: 26, fontFace: FONT_FACE, lineSpacing: 45 });

                    if (activeKey.includes('-v')) {
                        let parts = activeKey.split('-'); let u = parts[0]; let l = parts[1];
                        let vData = window.vocabDB[activeKey] || [];
                        vData.forEach((_, pIdx) => {
                            let bankId = `vocab-${u}-${l}-${pIdx}-bank`; let qId = `vocab-${u}-${l}-${pIdx}-q`;
                            let bankTxt = getText(bankId); let qTxt = getText(qId);
                            let slideV = pres.addSlide({ masterName: "MASTER_SLIDE" });
                            addSlideTitle(slideV, null, "어휘 Vocabulary");
                            let currentY = 1.0; let remainingHeight = 4.4;
                            if (bankTxt && bankTxt.trim() !== "") {
                                slideV.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: currentY, w: W_CONTENT, h: 0.9, fill: COLOR_BG_DARK, line: { color: COLOR_BORDER, width: 1 } });
                                slideV.addText(bankTxt, { x: 0.5, y: currentY + 0.05, w: 9.0, h: 0.8, color: COLOR_BLACK, fontSize: 20, fontFace: FONT_FACE, align: 'center', valign: 'middle', bold: true });
                                currentY += 1.1; remainingHeight -= 1.1;
                            }
                            slideV.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: currentY, w: W_CONTENT, h: remainingHeight, fill: COLOR_BG_LIGHT, line: { color: COLOR_BORDER, dashType: 'dash', width: 2 } });
                            slideV.addText(qTxt, { x: 0.6, y: currentY + 0.15, w: 8.8, h: remainingHeight - 0.3, color: COLOR_BLACK, fontSize: 22, fontFace: FONT_FACE, valign: 'top', lineSpacing: 35, wrap: true });
                        });
                    } else if (activeKey.startsWith('review-')) {
                        let rData = window.reviewDB[activeKey] || [];
                        rData.forEach((item, pIdx) => {
                            // 1. 단어 목록 분리 (isList)
                            if (item.isList) {
                                item.content.forEach((unit, uIdx) => {
                                    let slideR = pres.addSlide({ masterName: "MASTER_SLIDE" });
                                    addSlideTitle(slideR, null, item.type);
                                    slideR.addText(item.title, { x: X_MARGIN, y: 0.85, w: W_CONTENT, h: 0.4, color: "1E40AF", fontSize: 24, bold: true, fontFace: FONT_FACE });
                                    
                                    let currentY = 1.35;
                                    slideR.addText(`[${unit.t}]`, { x: X_MARGIN, y: currentY, w: W_CONTENT, h: 0.3, color: "1E40AF", fontSize: 20, bold: true, fontFace: FONT_FACE });
                                    currentY += 0.4;
                                    
                                    let rows = []; let words = unit.words;
                                    for(let i=0; i<words.length; i+=4) {
                                        let r = [];
                                        // 폰트 크기 24pt 고정
                                        r.push({ text: `☐ ${words[i]||''}`, options: { fontSize: 24, fontFace: FONT_FACE, border: {pt:1, color: COLOR_BORDER}, align:'left' } });
                                        r.push({ text: words[i+1] ? `☐ ${words[i+1]}` : '', options: { fontSize: 24, fontFace: FONT_FACE, border: {pt:1, color: COLOR_BORDER}, align:'left' } });
                                        r.push({ text: words[i+2] ? `☐ ${words[i+2]}` : '', options: { fontSize: 24, fontFace: FONT_FACE, border: {pt:1, color: COLOR_BORDER}, align:'left' } });
                                        r.push({ text: words[i+3] ? `☐ ${words[i+3]}` : '', options: { fontSize: 24, fontFace: FONT_FACE, border: {pt:1, color: COLOR_BORDER}, align:'left' } });
                                        rows.push(r);
                                    }
                                    slideR.addTable(rows, { x: X_MARGIN, y: currentY, w: W_CONTENT, colW: [2.3, 2.3, 2.3, 2.3] });
                                });
                            } else if (item.title && item.title.includes("문법과 표현의 의미를 확인해 보세요")) {
                                // 2. 문법 의미 확인 파트 (문법별 1페이지씩)
                                let rules = item.q.split('\n\n');
                                rules.forEach((rule) => {
                                    let slideR = pres.addSlide({ masterName: "MASTER_SLIDE" });
                                    addSlideTitle(slideR, null, item.type);
                                    slideR.addText(item.title, { x: X_MARGIN, y: 0.85, w: W_CONTENT, h: 0.4, color: "1E40AF", fontSize: 24, bold: true, fontFace: FONT_FACE });
                                    slideR.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: 1.35, w: W_CONTENT, h: 4.0, fill: COLOR_BG_LIGHT, line: { color: COLOR_BORDER, dashType: 'dash', width: 2 } });
                                    // V, A, N 변환
                                    let formattedRule = rule.replace(/동-/g, 'V-').replace(/형-/g, 'A-').replace(/명/g, 'N');
                                    slideR.addText(formattedRule, { x: 0.6, y: 1.45, w: 8.8, h: 3.8, color: COLOR_BLACK, fontSize: 24, fontFace: FONT_FACE, valign: 'middle', align: 'center', lineSpacing: 40, wrap: true });
                                });
                            } else if (item.type === "발음") {
                                // 3. 발음 항목 분리
                                let pParts = item.q.split('\n\n');
                                pParts.forEach((pPart) => {
                                    let slideR = pres.addSlide({ masterName: "MASTER_SLIDE" });
                                    addSlideTitle(slideR, null, item.type);
                                    slideR.addText(item.title, { x: X_MARGIN, y: 0.85, w: W_CONTENT, h: 0.4, color: "1E40AF", fontSize: 24, bold: true, fontFace: FONT_FACE });
                                    slideR.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: 1.35, w: W_CONTENT, h: 4.0, fill: COLOR_BG_LIGHT, line: { color: COLOR_BORDER, dashType: 'dash', width: 2 } });
                                    slideR.addText(pPart, { x: 0.6, y: 1.45, w: 8.8, h: 3.8, color: COLOR_BLACK, fontSize: 24, fontFace: FONT_FACE, valign: 'middle', align: 'left', lineSpacing: 40, wrap: true });
                                });
                            } else {
                                // 일반 듣기, 읽기, 쓰기, 기타 말하기
                                let bankTxt = getText(`review-${pIdx}-bank`); let qTxt = getText(`review-content-${pIdx}`);
                                
                                // 긴 텍스트 자동 페이지 분리 (읽기 지문 등)
                                // 500자가 넘어가면 페이지를 자름
                                let MAX_CHARS = 450;
                                if (qTxt && qTxt.length > MAX_CHARS) {
                                    let textParts = [];
                                    let sentences = qTxt.split('\n');
                                    let currentPart = "";
                                    for(let i=0; i<sentences.length; i++) {
                                        if(currentPart.length + sentences[i].length > MAX_CHARS) {
                                            textParts.push(currentPart);
                                            currentPart = sentences[i] + "\n";
                                        } else {
                                            currentPart += sentences[i] + "\n";
                                        }
                                    }
                                    if(currentPart) textParts.push(currentPart);

                                    textParts.forEach((part, partIdx) => {
                                        let slideR = pres.addSlide({ masterName: "MASTER_SLIDE" });
                                        addSlideTitle(slideR, null, item.type);
                                        slideR.addText(item.title + (textParts.length > 1 ? ` [지문 ${partIdx+1}]` : " [지문]"), { x: X_MARGIN, y: 0.85, w: W_CONTENT, h: 0.4, color: "1E40AF", fontSize: 24, bold: true, fontFace: FONT_FACE });
                                        
                                        let currentY = 1.35; let remainingHeight = 4.0;
                                        if (bankTxt && bankTxt.trim() !== "" && partIdx === 0) {
                                            slideR.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: currentY, w: W_CONTENT, h: 1.2, fill: COLOR_BG_DARK, line: { color: COLOR_BORDER, width: 1 } });
                                            slideR.addText(bankTxt, { x: 0.5, y: currentY + 0.1, w: 9.0, h: 1.0, color: COLOR_BLACK, fontSize: 18, fontFace: FONT_FACE, align: 'center', valign: 'middle', bold: true });
                                            currentY += 1.3; remainingHeight -= 1.3;
                                        }
                                        slideR.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: currentY, w: W_CONTENT, h: remainingHeight, fill: COLOR_BG_LIGHT, line: { color: COLOR_BORDER, dashType: 'dash', width: 2 } });
                                        slideR.addText(part, { x: 0.5, y: currentY + 0.1, w: 9.0, h: remainingHeight - 0.2, color: COLOR_BLACK, fontSize: 20, fontFace: FONT_FACE, valign: 'top', lineSpacing: 30, wrap: true });
                                    });
                                } else {
                                    // 분리할 필요 없는 정상 길이
                                    let slideR = pres.addSlide({ masterName: "MASTER_SLIDE" });
                                    addSlideTitle(slideR, null, item.type);
                                    slideR.addText(item.title, { x: X_MARGIN, y: 0.85, w: W_CONTENT, h: 0.4, color: "1E40AF", fontSize: 24, bold: true, fontFace: FONT_FACE });
                                    
                                    let currentY = 1.35; let remainingHeight = 4.0;
                                    if (bankTxt && bankTxt.trim() !== "") {
                                        slideR.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: currentY, w: W_CONTENT, h: 1.2, fill: COLOR_BG_DARK, line: { color: COLOR_BORDER, width: 1 } });
                                        slideR.addText(bankTxt, { x: 0.5, y: currentY + 0.1, w: 9.0, h: 1.0, color: COLOR_BLACK, fontSize: 18, fontFace: FONT_FACE, align: 'center', valign: 'middle', bold: true });
                                        currentY += 1.3; remainingHeight -= 1.3;
                                    }
                                    slideR.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: currentY, w: W_CONTENT, h: remainingHeight, fill: COLOR_BG_LIGHT, line: { color: COLOR_BORDER, dashType: 'dash', width: 2 } });
                                    slideR.addText(qTxt, { x: 0.5, y: currentY + 0.1, w: 9.0, h: remainingHeight - 0.2, color: COLOR_BLACK, fontSize: 20, fontFace: FONT_FACE, valign: 'top', lineSpacing: 30, wrap: true });
                                }
                            }
                        });
                    } else {
                        [1, 2].forEach(gIdx => {
                            if(!document.getElementById(`intro-${gIdx}-a`)) return;
                            let slide2 = pres.addSlide({ masterName: "MASTER_SLIDE" });
                            addSlideTitle(slide2, `intro-${gIdx}-title`);
                            slide2.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: 1.1, w: 4.4, h: 4.1, fill: COLOR_BG_LIGHT });
                            slide2.addText(getText(`intro-${gIdx}-a`) + "\n\n" + getText(`intro-${gIdx}-b`), { x: 0.6, y: 1.1, w: 4.0, h: 4.1, color: COLOR_BLACK, fontSize: 24, fontFace: FONT_FACE, valign: 'middle', lineSpacing: 35 });
                            slide2.addShape(pres.ShapeType.rect, { x: 5.2, y: 1.1, w: 4.4, h: 4.1, fill: COLOR_BG_DARK });
                            slide2.addText(getText(`intro-${gIdx}-img`), { x: 5.2, y: 1.1, w: 4.4, h: 4.1, color: COLOR_GRAY, fontSize: 20, fontFace: FONT_FACE, align: 'center', valign: 'middle', bold: true });

                            let slide3 = pres.addSlide({ masterName: "MASTER_SLIDE" });
                            addSlideTitle(slide3, `mean-${gIdx}-title`);
                            slide3.addText("의미", { x: X_MARGIN, y: 1.0, w: W_CONTENT, h: 0.4, color: COLOR_NAVY, fontSize: 24, bold: true, fontFace: FONT_FACE, valign: 'top' });
                            slide3.addText(getText(`mean-${gIdx}-desc`), { x: X_MARGIN, y: 1.4, w: W_CONTENT, h: 0.6, color: COLOR_BLACK, fontSize: 22, fontFace: FONT_FACE, valign: 'top' });
                            slide3.addText("예문", { x: X_MARGIN, y: 2.2, w: W_CONTENT, h: 0.4, color: COLOR_NAVY, fontSize: 24, bold: true, fontFace: FONT_FACE, valign: 'top' });
                            let exArr = [];
                            for(let i=0; i<10; i++) {
                                let exTxt = getText(`mean-${gIdx}-ex-${i}`);
                                if(exTxt) exArr.push({ text: exTxt + "\n\n", options: { color: COLOR_BLACK } });
                            }
                            slide3.addText(exArr, { x: X_MARGIN, y: 2.6, w: W_CONTENT, h: 2.5, fontSize: 22, fontFace: FONT_FACE, lineSpacing: 32, valign: 'top', wrap: false });

                            let thOpts = { fill: COLOR_NAVY, color: "FFFFFF", bold: true, fontSize: 22, fontFace: FONT_FACE, align: "center", valign: "middle", border: { pt: 1, color: COLOR_BORDER }, margin: 6 };
                            function txt(content, bOpts) { return { text: content, options: { color: COLOR_BLACK, fontSize: 22, fontFace: FONT_FACE, align: "center", valign: "middle", border: bOpts } }; }
                            function posTxt(posStr, content, bOpts) { return { text: [{ text: posStr + " ", options: { color: COLOR_NAVY, bold: true } }, { text: content, options: { color: COLOR_BLACK, bold: false } }], options: { fontSize: 22, fontFace: FONT_FACE, align: "center", valign: "middle", border: bOpts } }; }

                            for(let tIdx=0; tIdx<5; tIdx++) {
                                if(!document.getElementById(`tbl-${gIdx}-${tIdx}-title`)) continue;
                                let slideT = pres.addSlide();
                                addSlideTitle(slideT, `tbl-${gIdx}-${tIdx}-title`);
                                let rows = [];
                                rows.push([{ text: "결합 형태", options: thOpts }, { text: "기본형", options: thOpts }, { text: "활용형", options: thOpts }]);
                                let borderOpts = [ {pt:1, color:COLOR_BORDER}, {pt:1, color:COLOR_BORDER}, {pt:1, color:COLOR_BORDER}, {pt:1, color:COLOR_BORDER} ];
                                let borderNoBot = [ {pt:1, color:COLOR_BORDER}, {pt:1, color:COLOR_BORDER}, {pt:0}, {pt:1, color:COLOR_BORDER} ];
                                let borderNoTop = [ {pt:0}, {pt:1, color:COLOR_BORDER}, {pt:1, color:COLOR_BORDER}, {pt:1, color:COLOR_BORDER} ];

                                for(let rIdx=0; rIdx<15; rIdx++) {
                                    let c1 = getText(`tbl-${gIdx}-${tIdx}-r${rIdx}-c1`); let c2 = getText(`tbl-${gIdx}-${tIdx}-r${rIdx}-c2`);
                                    if(!c1 && !c2) continue; 
                                    let tr = [];
                                    let cell0 = document.getElementById(`tbl-${gIdx}-${tIdx}-r${rIdx}-c0`);
                                    if (cell0) {
                                        let rspan = cell0.getAttribute('rowspan') || 1;
                                        let fullCellText = cell0.innerText;
                                        let firstSpace = fullCellText.indexOf(' ');
                                        let posPart = firstSpace > -1 ? fullCellText.substring(0, firstSpace) : fullCellText;
                                        let restPart = firstSpace > -1 ? fullCellText.substring(firstSpace) : "";
                                        tr.push(posTxt(posPart, restPart, rspan > 1 ? borderNoBot : borderOpts));
                                    } else {
                                        tr.push(txt("", borderNoTop)); 
                                    }
                                    tr.push(txt(c1, borderOpts)); tr.push(txt(c2, borderOpts));
                                    rows.push(tr);
                                }
                                slideT.addTable(rows, { x: X_MARGIN, y: 1.1, w: W_CONTENT, colW: [3.5, 2.5, 3.2] });
                            }

                            for(let pIdx=0; pIdx<30; pIdx++) {
                                let pTxt = getText(`prac-${gIdx}-${pIdx}-txt`);
                                if(!pTxt) continue;
                                let slideP = pres.addSlide();
                                addSlideTitle(slideP, null, "확인 및 연습");
                                slideP.addText(`Q${pIdx + 1}.`, { x: X_MARGIN, y: 1.0, w: 0.95, h: 0.5, color: COLOR_NAVY, fontSize: 26, bold: true, fontFace: FONT_FACE, valign: 'top' });
                                slideP.addShape(pres.ShapeType.rect, { x: X_MARGIN+0.95, y: 1.0, w: W_CONTENT-0.95, h: 4.3, fill: COLOR_BG_LIGHT, line: { color: COLOR_BORDER, dashType: 'dash', width: 2 } });
                                slideP.addText(pTxt, { x: X_MARGIN+1.15, y: 1.1, w: W_CONTENT-1.35, h: 4.1, color: COLOR_BLACK, fontSize: 22, fontFace: FONT_FACE, valign: 'top', lineSpacing: 35, wrap: true });
                            }
                        });
                    }

                    let safeTitle = activeKey.replace(/[<>:"\/\\|?*\x00-\x1F]/g, "_");
                    pres.writeFile({ fileName: `서울대_한국어_4A_${safeTitle}.pptx` }).then(() => {
                        btn.innerHTML = '<i class="fa-solid fa-check"></i> 다운로드 완료';
                        showModal("🎉 PPTX 파일 다운로드가 완료되었습니다.");
                        setTimeout(() => { btn.innerHTML = originalText; btn.disabled = false; }, 3000);
                    });
                } catch(e) { showModal("❌ 오류 발생: " + e.message); btn.innerHTML = originalText; btn.disabled = false; }
            }, 100);
        }
    </script>
</body>
</html>
