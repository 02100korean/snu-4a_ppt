        function openPreview(key) {

                titleText = `${parts[0]}단원. ${unitTitles[parts[0]][parts[1]-1]} (${parts[0]}-${parts[1]}. 어휘)`;

                    if(row[0]) {
                        let pos = row[0].p ? `<span class="pos-text">${row[0].p}</span> ` : "";
                        trs += `<td rowspan="${row[0].rs || 1}" id="tbl-${gIdx}-${tIdx}-r${rIdx}-c0" contenteditable="true">${pos}${row[0].t.replace(/\n/g, '<br>')}</td>`;
                    }
                    trs += `<td id="tbl-${gIdx}-${tIdx}-r${rIdx}-c1" contenteditable="true">${row[1]||''}</td><td id="tbl-${gIdx}-${tIdx}-r${rIdx}-c2" contenteditable="true">${row[2]||''}</td></tr>`;
                });
                html += `
                    <div class="slide-wrapper">
                        <div class="slide-container">
                            <div class="slide-title" id="tbl-${gIdx}-${tIdx}-title" contenteditable="true">${tbl.t}</div>
                            <div class="content-area">
                                <div class="table-wrapper">
                                    <table>
                                        <thead><tr><th style="width:40%;" contenteditable="true">${tbl.h[0]}</th><th style="width:25%;" contenteditable="true">${tbl.h[1]}</th><th style="width:35%;" contenteditable="true">${tbl.h[2]}</th></tr></thead>
                                        <tbody>${trs}</tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>`;
            });
            obj.p.forEach((prac, pIdx) => {
                let pracStr = prac.replace(/___/g, '(                                                  )').replace(/\n/g, '<br>');
                html += `
                    <div class="slide-wrapper">
                        <div class="slide-container">
                            <div class="slide-title" contenteditable="true">확인 및 연습</div>
                            <div class="content-area">
                                <div class="practice-wrapper">
                                    <div class="practice-num">Q${pIdx + 1}.</div>
                                    <div class="practice-box" id="prac-${gIdx}-${pIdx}-txt" contenteditable="true">${pracStr}</div>
                                </div>
                            </div>
                        </div>
                    </div>`;
            });
            return html;
        }

        function downloadPPTX() {
            let btn = document.getElementById('downloadBtn'); let originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 생성 중...'; btn.disabled = true;

            setTimeout(() => {
                try {
                    let pres = new PptxGenJS(); pres.layout = 'LAYOUT_16x9'; 
                    let COLOR_NAVY = "27408B"; let COLOR_BLACK = "000000"; let COLOR_GRAY = "64748B"; let COLOR_BORDER = "CBD5E1";
                    let COLOR_BG_LIGHT = "F8FAFC"; let COLOR_BG_DARK = "E2E8F0"; let FONT_FACE = "맑은 고딕";
                    let X_MARGIN = 0.625; let W_CONTENT = 8.75; 

                    pres.defineSlideMaster({ title: "MASTER_SLIDE", background: { fill: "FFFFFF" }, objects: [{ rect: { x: 0, y: 0, w: "100%", h: 0.1, fill: COLOR_NAVY } }] });
                    function getText(id) { let el = document.getElementById(id); return el ? el.innerText : ""; }
                    function addSlideTitle(slide, textId) {
                        slide.addText(getText(textId) || "제목", { x: X_MARGIN, y: 0.45, w: W_CONTENT, h: 0.4, valign: 'bottom', color: COLOR_NAVY, fontSize: 30, bold: true, fontFace: FONT_FACE });
                        slide.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: 0.93, w: W_CONTENT, h: 0.03, fill: COLOR_NAVY });
                    }

                    let slide1 = pres.addSlide();
                    slide1.addText(getText("title-sub"), { x: 4.0, y: 0.3, w: 5.375, align: 'right', color: COLOR_GRAY, fontSize: 24, bold: true, fontFace: FONT_FACE });
                    slide1.addShape(pres.ShapeType.rect, { x: 0, y: 1.9, w: 10, h: 1.2, fill: COLOR_NAVY });
                    slide1.addText(getText("title-main"), { x: 0, y: 1.9, w: 10, h: 1.2, align: 'center', valign: 'middle', color: "FFFFFF", fontSize: 50, bold: true, fontFace: FONT_FACE });
                    let gTextArr = [];
                    for(let i=0; i<10; i++) {
                        let fullText = getText(`title-g-${i}`);
                        if(fullText) {
                            let firstSpace = fullText.indexOf(' ');
                            let pos = firstSpace > -1 ? fullText.substring(0, firstSpace) : fullText;
                            let rest = firstSpace > -1 ? fullText.substring(firstSpace) : "";
                            gTextArr.push({ text: pos + " ", options: { color: COLOR_NAVY, bold: true } });
                            gTextArr.push({ text: rest + "\n", options: { color: COLOR_BLACK, bold: false } });
                        }
                    }
                    if(gTextArr.length > 0) slide1.addText(gTextArr, { x: 0, y: 3.5, w: 10, h: 2.0, align: 'center', valign: 'top', fontSize: 26, fontFace: FONT_FACE, lineSpacing: 45 });

                    if (activeKey.includes('-v')) {
                        let parts = activeKey.split('-');
                        let u = parts[0]; let l = parts[1];
                        let vData = window.vocabDB[activeKey] || [];
                        
                        vData.forEach((_, pIdx) => {
                            let bankId = `vocab-${u}-${l}-${pIdx}-bank`;
                            let qId = `vocab-${u}-${l}-${pIdx}-q`;
                            let bankTxt = getText(bankId); let qTxt = getText(qId);
                            
                            let slideV = pres.addSlide({ masterName: "MASTER_SLIDE" });
                            slideV.addText("어휘 Vocabulary", { x: X_MARGIN, y: 0.45, w: W_CONTENT, h: 0.4, valign: 'bottom', color: COLOR_NAVY, fontSize: 30, bold: true, fontFace: FONT_FACE });
                            slideV.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: 0.93, w: W_CONTENT, h: 0.03, fill: COLOR_NAVY });
                            
                            let currentY = 1.25; let remainingHeight = 4.1;
                            if (bankTxt && bankTxt.trim() !== "") {
                                slideV.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: currentY, w: W_CONTENT, h: 1.0, fill: COLOR_BG_DARK, line: { color: COLOR_BORDER, width: 1 } });
                                slideV.addText(bankTxt, { x: 0.8, y: currentY + 0.1, w: 8.4, h: 0.8, color: COLOR_BLACK, fontSize: 20, fontFace: FONT_FACE, align: 'center', valign: 'middle', bold: true });
                                currentY += 1.2; remainingHeight -= 1.2;
                            }
                            slideV.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: currentY, w: W_CONTENT, h: remainingHeight, fill: COLOR_BG_LIGHT, line: { color: COLOR_BORDER, dashType: 'dash', width: 2 } });
                            slideV.addText(qTxt, { x: 0.85, y: currentY + 0.15, w: 8.3, h: remainingHeight - 0.3, color: COLOR_BLACK, fontSize: 22, fontFace: FONT_FACE, valign: 'top', lineSpacing: 35, wrap: true });
                        });
                    } else if (activeKey.startsWith('review-')) {
                        for(let pIdx=0; pIdx<20; pIdx++) {
                            let pTxt = getText(`review-content-${pIdx}`);
                            if (!pTxt) continue;
                            let slideR = pres.addSlide({ masterName: "MASTER_SLIDE" });
                            slideR.addText("확인 및 연습", { x: X_MARGIN, y: 0.45, w: W_CONTENT, h: 0.4, valign: 'bottom', color: COLOR_NAVY, fontSize: 30, bold: true, fontFace: FONT_FACE });
                            slideR.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: 0.93, w: W_CONTENT, h: 0.03, fill: COLOR_NAVY });
                            slideR.addText(`Q${pIdx + 1}.`, { x: 0.3, y: 1.3, w: 0.95, h: 0.5, color: COLOR_NAVY, fontSize: 26, bold: true, fontFace: FONT_FACE, valign: 'top' });
                            slideR.addShape(pres.ShapeType.rect, { x: 1.25, y: 1.25, w: 8.3, h: 4.1, fill: COLOR_BG_LIGHT, line: { color: COLOR_BORDER, dashType: 'dash', width: 2 } });
                            slideR.addText(pTxt, { x: 1.5, y: 1.4, w: 7.8, h: 3.8, color: COLOR_BLACK, fontSize: 22, fontFace: FONT_FACE, valign: 'top', lineSpacing: 35, wrap: true });
                        }
                    } else {
                        [1, 2].forEach(gIdx => {
                            if(!document.getElementById(`intro-${gIdx}-a`)) return;
                            let slide2 = pres.addSlide({ masterName: "MASTER_SLIDE" });
                            addSlideTitle(slide2, `intro-${gIdx}-title`);
                            slide2.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: 1.3, w: 4.15, h: 3.9, fill: COLOR_BG_LIGHT });
                            slide2.addText(getText(`intro-${gIdx}-a`) + "\n\n" + getText(`intro-${gIdx}-b`), { x: 0.8, y: 1.3, w: 3.8, h: 3.9, color: COLOR_BLACK, fontSize: 24, fontFace: FONT_FACE, valign: 'middle', lineSpacing: 35 });
                            slide2.addShape(pres.ShapeType.rect, { x: 5.125, y: 1.3, w: 4.25, h: 3.9, fill: COLOR_BG_DARK });
                            slide2.addText(getText(`intro-${gIdx}-img`), { x: 5.125, y: 1.3, w: 4.25, h: 3.9, color: COLOR_GRAY, fontSize: 20, fontFace: FONT_FACE, align: 'center', valign: 'middle', bold: true });

                            let slide3 = pres.addSlide({ masterName: "MASTER_SLIDE" });
                            addSlideTitle(slide3, `mean-${gIdx}-title`);
                            slide3.addText("의미", { x: X_MARGIN, y: 1.3, w: W_CONTENT, h: 0.4, color: COLOR_NAVY, fontSize: 24, bold: true, fontFace: FONT_FACE, valign: 'top' });
                            slide3.addText(getText(`mean-${gIdx}-desc`), { x: X_MARGIN, y: 1.8, w: W_CONTENT, h: 0.6, color: COLOR_BLACK, fontSize: 22, fontFace: FONT_FACE, valign: 'top' });
                            slide3.addText("예문", { x: X_MARGIN, y: 2.6, w: W_CONTENT, h: 0.4, color: COLOR_NAVY, fontSize: 24, bold: true, fontFace: FONT_FACE, valign: 'top' });
                            let exArr = [];
                            for(let i=0; i<10; i++) {
                                let exTxt = getText(`mean-${gIdx}-ex-${i}`);
                                if(exTxt) exArr.push({ text: exTxt + "\n\n", options: { color: COLOR_BLACK } });
                            }
                            slide3.addText(exArr, { x: X_MARGIN, y: 3.1, w: W_CONTENT, h: 2.0, fontSize: 22, fontFace: FONT_FACE, lineSpacing: 32, valign: 'top', wrap: false });

                            let thOpts = { fill: COLOR_NAVY, color: "FFFFFF", bold: true, fontSize: 22, fontFace: FONT_FACE, align: "center", valign: "middle", border: { pt: 1, color: COLOR_BORDER }, margin: 6 };
                            function txt(content, bOpts) { return { text: content, options: { color: COLOR_BLACK, fontSize: 22, fontFace: FONT_FACE, align: "center", valign: "middle", border: bOpts } }; }
                            function posTxt(posStr, content, bOpts) { return { text: [{ text: posStr + " ", options: { color: COLOR_NAVY, bold: true } }, { text: content, options: { color: COLOR_BLACK, bold: false } }], options: { fontSize: 22, fontFace: FONT_FACE, align: "center", valign: "middle", border: bOpts } }; }

                            for(let tIdx=0; tIdx<5; tIdx++) {
                                if(!document.getElementById(`tbl-${gIdx}-${tIdx}-title`)) continue;
                                let slideT = pres.addSlide();
                                addSlideTitle(slideT, `tbl-${gIdx}-${tIdx}-title`);
                                let rows = [];
                                rows.push([{ text: "결합 형태", options: thOpts }, { text: "기본형", options: thOpts }, { text: "활용형", options: thOpts }]);
                                let borderOpts = [ {pt:1, color:COLOR_BORDER}, {pt:1, color:COLOR_BORDER}, {pt:1, color:COLOR_BORDER}, {pt:1, color:COLOR_BORDER} ];
                                let borderNoBot = [ {pt:1, color:COLOR_BORDER}, {pt:1, color:COLOR_BORDER}, {pt:0}, {pt:1, color:COLOR_BORDER} ];
                                let borderNoTop = [ {pt:0}, {pt:1, color:COLOR_BORDER}, {pt:1, color:COLOR_BORDER}, {pt:1, color:COLOR_BORDER} ];

                                for(let rIdx=0; rIdx<15; rIdx++) {
                                    let c1 = getText(`tbl-${gIdx}-${tIdx}-r${rIdx}-c1`); let c2 = getText(`tbl-${gIdx}-${tIdx}-r${rIdx}-c2`);
                                    if(!c1 && !c2) continue; 
                                    let tr = [];
                                    let cell0 = document.getElementById(`tbl-${gIdx}-${tIdx}-r${rIdx}-c0`);
                                    if (cell0) {
                                        let rspan = cell0.getAttribute('rowspan') || 1;
                                        let fullCellText = cell0.innerText;
                                        let firstSpace = fullCellText.indexOf(' ');
                                        let posPart = firstSpace > -1 ? fullCellText.substring(0, firstSpace) : fullCellText;
                                        let restPart = firstSpace > -1 ? fullCellText.substring(firstSpace) : "";
                                        tr.push(posTxt(posPart, restPart, rspan > 1 ? borderNoBot : borderOpts));
                                    } else {
                                        tr.push(txt("", borderNoTop)); 
                                    }
                                    tr.push(txt(c1, borderOpts)); tr.push(txt(c2, borderOpts));
                                    rows.push(tr);
                                }
                                slideT.addTable(rows, { x: X_MARGIN, y: 1.3, w: W_CONTENT, colW: [3.5, 2.0, 3.25] });
                            }

                            for(let pIdx=0; pIdx<30; pIdx++) {
                                let pTxt = getText(`prac-${gIdx}-${pIdx}-txt`);
                                if(!pTxt) continue;
                                let slideP = pres.addSlide();
                                slideP.addText("확인 및 연습", { x: X_MARGIN, y: 0.45, w: W_CONTENT, h: 0.4, valign: 'bottom', color: COLOR_NAVY, fontSize: 30, bold: true, fontFace: FONT_FACE });
                                slideP.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: 0.93, w: W_CONTENT, h: 0.03, fill: COLOR_NAVY });
                                slideP.addText(`Q${pIdx + 1}.`, { x: 0.3, y: 1.3, w: 0.95, h: 0.5, color: COLOR_NAVY, fontSize: 26, bold: true, fontFace: FONT_FACE, valign: 'top' });
                                slideP.addShape(pres.ShapeType.rect, { x: 1.25, y: 1.25, w: 8.3, h: 4.1, fill: COLOR_BG_LIGHT, line: { color: COLOR_BORDER, dashType: 'dash', width: 2 } });
                                slideP.addText(pTxt, { x: 1.5, y: 1.4, w: 7.8, h: 3.8, color: COLOR_BLACK, fontSize: 22, fontFace: FONT_FACE, valign: 'top', lineSpacing: 35, wrap: true });
                            }
                        });
                    }

                    let safeTitle = activeKey.replace(/[<>:"\/\\|?*\x00-\x1F]/g, "_");
                    pres.writeFile({ fileName: `서울대_한국어_4A_${safeTitle}.pptx` }).then(() => {
                        btn.innerHTML = '<i class="fa-solid fa-check"></i> 다운로드 완료';
                        showModal("🎉 PPTX 파일 다운로드가 완료되었습니다.");
                        setTimeout(() => { btn.innerHTML = originalText; btn.disabled = false; }, 3000);
                    });
                } catch(e) { showModal("❌ 오류 발생: " + e.message); btn.innerHTML = originalText; btn.disabled = false; }
            }, 100);
        }
    </script>
</body>
</html>
