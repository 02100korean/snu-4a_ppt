<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서울대 한국어 4A - 스마트 슬라이드 제너레이터</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Malgun Gothic', '맑은 고딕', sans-serif !important; background-color: #f1f5f9; display: flex; flex-direction: column; min-height: 100vh; }
        .hero-section { background-color: #1e3a8a; padding: 70px 20px; text-align: center; color: white; border-bottom: 5px solid #3b82f6; }
        .hero-title { font-size: 42px; font-weight: bold; margin-bottom: 15px; }
        .hero-subtitle { font-size: 18px; color: #bfdbfe; font-weight: normal; }
        .content-container { max-width: 1200px; margin: 50px auto; padding: 0 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
        .card { background-color: white; border-radius: 12px; padding: 40px 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; transition: all 0.3s ease; border: 1px solid #e2e8f0; }
        .card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); border-color: #93c5fd; }
        .card-icon { font-size: 50px; color: #3b82f6; margin-bottom: 20px; }
        .card-title { font-size: 26px; font-weight: bold; color: #1e293b; margin-bottom: 15px; }
        .card-desc { font-size: 15px; color: #64748b; margin-bottom: 30px; line-height: 1.6; }
        .card-btn { display: inline-block; background-color: #3b82f6; color: white; font-weight: bold; font-size: 16px; padding: 12px 25px; border-radius: 8px; text-decoration: none; transition: background-color 0.2s; }
        .card-btn:hover { background-color: #2563eb; }
        .footer { margin-top: auto; padding: 20px; text-align: center; color: #94a3b8; font-size: 14px; }
    </style>
</head>
<body>
    <div class="hero-section">
        <h1 class="hero-title">서울대 한국어 4A <br>스마트 슬라이드 제너레이터</h1>
        <h2 class="hero-subtitle">원하시는 단원을 선택하여 PPTX 템플릿을 자동으로 생성하고 편집하세요.</h2>
    </div>

    <div class="content-container">
        <!-- 1~3단원 -->
        <div class="card">
            <div class="card-icon"><i class="fa-solid fa-book"></i></div>
            <h3 class="card-title">1단원 ~ 3단원</h3>
            <p class="card-desc">진로, 건강, 만족과 후회<br>어휘 및 문법, 복습 1-3과</p>
            <a href="1_3.html" class="card-btn">생성기 열기 <i class="fa-solid fa-arrow-right ml-1"></i></a>
        </div>
        <!-- 4~6단원 -->
        <div class="card">
            <div class="card-icon"><i class="fa-solid fa-book-open"></i></div>
            <h3 class="card-title">4단원 ~ 6단원</h3>
            <p class="card-desc">날씨, 풍경, 축제<br>어휘 및 문법, 복습 4-6과</p>
            <a href="4_6.html" class="card-btn">생성기 열기 <i class="fa-solid fa-arrow-right ml-1"></i></a>
        </div>
        <!-- 7~9단원 -->
        <div class="card">
            <div class="card-icon"><i class="fa-solid fa-book-open-reader"></i></div>
            <h3 class="card-title">7단원 ~ 9단원</h3>
            <p class="card-desc">조사 결과, 대중문화, 스포츠<br>어휘 및 문법, 복습 7-9과</p>
            <a href="7_9.html" class="card-btn">생성기 열기 <i class="fa-solid fa-arrow-right ml-1"></i></a>
        </div>
    </div>
    <div class="footer">© 2026 Seoul National University Korean 4A Smart Slide Generator.</div>
</body>
</html>
