        .slide-container h1, .slide-container h2, .slide-container h3, .slide-container p, .slide-container td, .slide-container th { margin: 0; color: #000000; line-height: 1.4; }

        [contenteditable="true"]:hover { background-color: rgba(59, 130, 246, 0.05); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        [contenteditable="true"]:focus { background-color: rgba(59, 130, 246, 0.1); box-shadow: 0 0 0 2px #3b82f6; }

        .slide1-navy-box { background-color: #1e3a8a; width: 1280px; position: absolute; top: 110px; left: -60px; padding: 15px 0; text-align: center; }

        .pos-text { color: #1e3a8a; font-weight: bold; } 

        /* Slide 2 (도입 상황) */
        .two-column { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 50px; width: 100%; height: 100%; align-items: center; }
        .dialogue-box { background-color: #f8fafc; padding: 40px; border-left: 6px solid #1e3a8a; display: flex; flex-direction: column; justify-content: center; height: 420px; border-radius: 12px; }

        .example-group { margin-bottom: 15px; }

                    "대화를 완성해 보세요.\n\n가: 요즘 바빠서 계속 인스턴트 음식을 먹어요.\n나: 계속 인스턴트 음식을 (                                        ) 건강이 나빠질 수도 있어요.",
                    "대화를 완성해 보세요.\n\n가: 저 사람 좀 보세요. 휴대폰 보면서 걷다가 차에 부딪힐 뻔했어요.\n나: 저렇게 (                                        ) 사고가 날 수도 있어요.",
                    "대화를 완성해 보세요.\n\n가: 너무 피곤해서 양치질하는 걸 잊어버려요.\n나: 자꾸 양치질을 안 (                                        ) 충치가 생길 수도 있어요.",
                    "대화를 완성해 보세요.\n\n가: 저는 집에서 불을 꺼 놓고 영화 보는 것을 좋아해요.\n나: 계속 어두운 곳에서 (                                        ) 눈이 나빠질 수도 있어요.",
                    "상황에 맞게 조언해 보세요.\n\n상황: 제 동생은 밖에 나가지도 않고 매일 책을 읽어요.\n조언: (                                                                                          )",
                    "상황에 맞게 조언해 보세요.\n\n상황: 한국 음식이 입에 안 맞아요.\n조언: (                                                                                          )",
                    "상황에 맞게 조언해 보세요.\n\n상황: 우리 언니는 밤새도록 드라마를 봐요.\n조언: (                                                                                          )",
                    "상황에 맞게 조언해 보세요.\n\n상황: 회사에서 이번에도 승진하지 못해서 속상해요.\n조언: (                                                                                          )",
                    "상황에 맞게 조언해 보세요.\n\n상황: 외국으로 유학을 가고 싶은데 부모님이 반대하세요.\n조언: (                                                                                          )"
                ]
            }
        };

        let currentKey = null;

        function renderSlides() {
            const select = document.getElementById("grammarSelect");
            currentKey = select.value;
            if(!currentKey) {
                showMessage("문법을 선택해 주세요.");
                return;
            }

            const data = db[currentKey];
            const container = document.getElementById("previewArea");
            container.innerHTML = ""; // 초기화

            // Slide 1: 타이틀 (valign: top 느낌을 주기 위해 마진 축소)
            let grammarHTML = data.grammarParts.map((p, idx) => 
                `<div id="s1-g-${idx}" contenteditable="true" style="margin-bottom:8px;"><span class="pos-text">${p.pos}</span> ${p.text}</div>`
            ).join('');

            container.innerHTML += `
                <div class="slide-wrapper" id="slide-1">
                    <div class="slide-container">
                        <div class="slide1-layout">
                            <div class="subtitle" id="s1-unit" contenteditable="true">${data.unitLabel}</div>
                            <div class="slide1-navy-box">
                                <div class="main-title" id="s1-title" contenteditable="true">문법과 표현</div>
                            </div>
                            <div class="grammar-points">
                                ${grammarHTML}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Slide 2: 도입
            container.innerHTML += `
                <div class="slide-wrapper" id="slide-2">
                    <div class="slide-container">
                        <div class="slide-title" id="s2-title" contenteditable="true">도입 상황</div>
                        <div class="content-area">
                            <div class="two-column">
                                <div class="dialogue-box">
                                    <p id="s2-a" contenteditable="true">${data.intro.speakerA.replace(/\n/g, '<br>')}</p>
                                    <p id="s2-b" contenteditable="true" style="margin-bottom: 0;">${data.intro.speakerB.replace(/\n/g, '<br>')}</p>
                                </div>
                                <div class="image-placeholder">
                                    <p id="s2-img-txt" contenteditable="true">[PDF 원본에서 그림을 복사하여<br>이곳에 붙여넣으세요]</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Slide 3: 의미와 예문
            let exHTML = data.examples.map((ex, idx) => 
                `<div class="example-group" id="s3-ex-${idx}" contenteditable="true">${ex.replace(/\n/g, '<br>')}</div>`
            ).join('');

            container.innerHTML += `
                <div class="slide-wrapper" id="slide-3">
                    <div class="slide-container">
                        <div class="slide-title" id="s3-title" contenteditable="true">의미와 예문</div>
                        <div class="content-area">
                            <div class="meaning-layout">
                                <div>
                                    <div class="section-title" contenteditable="true"><i class="fa-solid fa-lightbulb"></i> 의미</div>
                                    <p class="meaning-text" id="s3-mean" contenteditable="true">${data.meaning}</p>
                                </div>
                                <div>
                                    <div class="section-title" contenteditable="true"><i class="fa-solid fa-comments"></i> 예문</div>
                                    <div class="example-text">${exHTML}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Slide 4+: 형태 표 (테이블 데이터 분리 적용)
            data.tables.forEach((tbl, tIdx) => {
                let trs = "";
                tbl.rows.forEach((row, rIdx) => {
                    trs += "<tr>";
                    if(row[0] !== null) {
                        trs += `<td rowspan="${row[0].rowspan}" id="tbl-${tIdx}-r${rIdx}-c0" contenteditable="true">
                                    <span class="pos-text">${row[0].pos}</span> ${row[0].text}<br>
                                    <span class="sub-pos">${row[0].sub}</span>
                                </td>`;
                    }
                    trs += `<td id="tbl-${tIdx}-r${rIdx}-c1" contenteditable="true">${row[1]}</td>`;
                    trs += `<td id="tbl-${tIdx}-r${rIdx}-c2" contenteditable="true">${row[2]}</td>`;
                    trs += "</tr>";
                });

                container.innerHTML += `
                    <div class="slide-wrapper" id="slide-tbl-${tIdx}">
                        <div class="slide-container">
                            <div class="slide-title" id="tbl-${tIdx}-title" contenteditable="true">${tbl.title}</div>
                            <div class="content-area">
                                <div class="table-wrapper">
                                    <table>
                                        <thead>
                                            <tr>
                                                <th style="width: 40%;" contenteditable="true">${tbl.headers[0]}</th>
                                                <th style="width: 25%;" contenteditable="true">${tbl.headers[1]}</th>
                                                <th style="width: 35%;" contenteditable="true">${tbl.headers[2]}</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${trs}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            // Slide Practice: 연습문제 (1슬라이드 1문제 꽉 차게)
            data.practices.forEach((prac, pIdx) => {
                container.innerHTML += `
                    <div class="slide-wrapper" id="slide-prac-${pIdx}">
                        <div class="slide-container">
                            <div class="slide-title" contenteditable="true">확인 및 연습</div>
                            <div class="content-area">
                                <div class="practice-wrapper">
                                    <div class="practice-num" contenteditable="true">Q${pIdx + 1}.</div>
                                    <div class="practice-box" id="prac-${pIdx}-txt" contenteditable="true">${prac}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            document.getElementById("downloadBtn").disabled = false;
            showMessage("✅ 미리보기가 성공적으로 생성되었습니다. 내용을 클릭하여 수정해 보세요!");
        }

        function downloadPPTX() {
            let btn = document.getElementById('downloadBtn');
            let originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 생성 중...';
            btn.disabled = true;

            setTimeout(() => {
                try {
                    let pres = new PptxGenJS();
                    pres.layout = 'LAYOUT_16x9'; 
                    
                    let COLOR_NAVY = "1E3A8A"; 
                    let COLOR_BLACK = "000000";
                    let COLOR_GRAY = "64748B";
                    let COLOR_BORDER = "CBD5E1";
                    let COLOR_BG_LIGHT = "F8FAFC";
                    let FONT_FACE = "맑은 고딕";
                    let X_MARGIN = 0.5; 
                    let W_CONTENT = 9.0; 

                    pres.defineSlideMaster({
                        title: "MASTER_SLIDE",
                        background: { fill: "FFFFFF" },
                        objects: [
                            { rect: { x: 0, y: 0, w: "100%", h: 0.15, fill: COLOR_NAVY } }
                        ]
                    });

                    // 2~5번 슬라이드 공통 제목 위치 (하단 2mm 여백 맞춤)
                    function addSlideTitle(slide, textId) {
                        let text = document.getElementById(textId).innerText;
                        slide.addText(text, { 
                            x: X_MARGIN, y: 0.45, w: W_CONTENT, h: 0.4, 
                            valign: 'bottom', margin: 0,
                            color: COLOR_NAVY, fontSize: 30, bold: true, fontFace: FONT_FACE 
                        });
                        slide.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: 0.93, w: W_CONTENT, h: 0.03, fill: COLOR_NAVY });
                    }

                    // --- 1. 표지 슬라이드 ---
                    let slide1 = pres.addSlide({ masterName: "MASTER_SLIDE" });
                    slide1.addText(document.getElementById("s1-unit").innerText, { 
                        x: 4.0, y: 0.3, w: 5.5, align: 'right', color: COLOR_GRAY, fontSize: 24, bold: true, fontFace: FONT_FACE 
                    });
                    slide1.addShape(pres.ShapeType.rect, { x: 0, y: 1.6, w: 10, h: 1.2, fill: COLOR_NAVY });
                    slide1.addText(document.getElementById("s1-title").innerText, { 
                        x: 0, y: 1.6, w: 10, h: 1.2, align: 'center', valign: 'middle', color: "FFFFFF", fontSize: 50, bold: true, fontFace: FONT_FACE 
                    });

                    // 문법 리스트 (valign: top 적용 및 폰트 26 고정)
                    let gData = db[currentKey].grammarParts;
                    let gTextArr = [];
                    gData.forEach((_, idx) => {
                        let fullText = document.getElementById(`s1-g-${idx}`).innerText; 
                        let firstSpace = fullText.indexOf(' ');
                        let pos = firstSpace > -1 ? fullText.substring(0, firstSpace) : fullText;
                        let rest = firstSpace > -1 ? fullText.substring(firstSpace) : "";
                        gTextArr.push({ text: pos + " ", options: { color: COLOR_NAVY, bold: true } });
                        gTextArr.push({ text: rest + (idx < gData.length -1 ? "\n" : ""), options: { color: COLOR_BLACK, bold: false } });
                    });
                    slide1.addText(gTextArr, { x: 0, y: 3.2, w: 10, h: 2.5, align: 'center', valign: 'top', fontSize: 26, fontFace: FONT_FACE, lineSpacing: 45 });

                    // --- 2. 도입 상황 ---
                    let slide2 = pres.addSlide({ masterName: "MASTER_SLIDE" });
                    addSlideTitle(slide2, "s2-title");
                    slide2.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: 1.3, w: 4.25, h: 3.9, fill: COLOR_BG_LIGHT });
                    
                    let aText = document.getElementById("s2-a").innerText;
                    let bText = document.getElementById("s2-b").innerText;
                    slide2.addText(aText + "\n\n" + bText, {
                        x: 0.8, y: 1.3, w: 3.8, h: 3.9, color: COLOR_BLACK, fontSize: 24, fontFace: FONT_FACE, valign: 'middle', lineSpacing: 35
                    });
                    slide2.addShape(pres.ShapeType.rect, { x: 5.25, y: 1.3, w: 4.25, h: 3.9, fill: "E2E8F0" });
                    slide2.addText(document.getElementById("s2-img-txt").innerText, {
                        x: 5.25, y: 1.3, w: 4.25, h: 3.9, color: COLOR_GRAY, fontSize: 20, fontFace: FONT_FACE, align: 'center', valign: 'middle', bold: true
                    });

                    // --- 3. 의미와 예문 ---
                    let slide3 = pres.addSlide({ masterName: "MASTER_SLIDE" });
                    addSlideTitle(slide3, "s3-title");
                    
                    slide3.addText("의미", { x: X_MARGIN, y: 1.3, w: W_CONTENT, h: 0.4, color: COLOR_NAVY, fontSize: 24, bold: true, fontFace: FONT_FACE, valign: 'top' });
                    slide3.addText(document.getElementById("s3-mean").innerText, { x: X_MARGIN, y: 1.8, w: W_CONTENT, h: 0.6, color: COLOR_BLACK, fontSize: 22, fontFace: FONT_FACE, valign: 'top' });
                    
                    slide3.addText("예문", { x: X_MARGIN, y: 2.6, w: W_CONTENT, h: 0.4, color: COLOR_NAVY, fontSize: 24, bold: true, fontFace: FONT_FACE, valign: 'top' });
                    
                    let exArr = [];
                    db[currentKey].examples.forEach((_, idx) => {
                        let text = document.getElementById(`s3-ex-${idx}`).innerText;
                        exArr.push({ text: text + (idx < db[currentKey].examples.length -1 ? "\n\n" : ""), options: { color: COLOR_BLACK } });
                    });
                    slide3.addText(exArr, { x: X_MARGIN, y: 3.1, w: W_CONTENT, h: 2.0, fontSize: 22, fontFace: FONT_FACE, lineSpacing: 32, valign: 'top', wrap: false });

                    // --- 4. 표 Helper ---
                    function getCellOpts(rspan) {
                        let o = { color: COLOR_BLACK, fontSize: 22, fontFace: FONT_FACE, align: "center", valign: "middle", border: { pt: 1, color: COLOR_BORDER }, margin: 4 };
                        if(rspan) o.rowspan = rspan;
                        return o;
                    }
                    function getHeaderOpts() {
                        return { fill: COLOR_NAVY, color: "FFFFFF", bold: true, fontSize: 22, fontFace: FONT_FACE, align: "center", valign: "middle", border: { pt: 1, color: COLOR_BORDER }, margin: 6 };
                    }

                    // --- 5. 테이블 슬라이드 (동적 분리 렌더링) ---
                    db[currentKey].tables.forEach((tbl, tIdx) => {
                        let slideT = pres.addSlide({ masterName: "MASTER_SLIDE" });
                        addSlideTitle(slideT, `tbl-${tIdx}-title`);

                        let rows = [];
                        rows.push([
                            { text: document.querySelector(`#slide-tbl-${tIdx} th:nth-child(1)`).innerText, options: getHeaderOpts() }, 
                            { text: document.querySelector(`#slide-tbl-${tIdx} th:nth-child(2)`).innerText, options: getHeaderOpts() }, 
                            { text: document.querySelector(`#slide-tbl-${tIdx} th:nth-child(3)`).innerText, options: getHeaderOpts() }
                        ]);

                        tbl.rows.forEach((r, rIdx) => {
                            let tr = [];
                            if (r[0] !== null) {
                                let fullCellText = document.getElementById(`tbl-${tIdx}-r${rIdx}-c0`).innerText;
                                let firstSpace = fullCellText.indexOf(' ');
                                let posPart = firstSpace > -1 ? fullCellText.substring(0, firstSpace) : fullCellText;
                                let restPart = firstSpace > -1 ? fullCellText.substring(firstSpace) : "";
                                
                                tr.push({
                                    text: [
                                        { text: posPart, options: { color: COLOR_NAVY, bold: true } },
                                        { text: restPart, options: { color: COLOR_BLACK, bold: false } }
                                    ],
                                    options: getCellOpts(r[0].rowspan)
                                });
                            }
                            tr.push({ text: document.getElementById(`tbl-${tIdx}-r${rIdx}-c1`).innerText, options: getCellOpts() });
                            tr.push({ text: document.getElementById(`tbl-${tIdx}-r${rIdx}-c2`).innerText, options: getCellOpts() });
                            rows.push(tr);
                        });

                        slideT.addTable(rows, { x: X_MARGIN, y: 1.3, w: W_CONTENT, colW: [3.5, 2.0, 3.5] });
                    });

                    // --- 6. 연습문제 슬라이드 (1페이지 1문항 꽉 차게) ---
                    db[currentKey].practices.forEach((_, pIdx) => {
                        let slideP = pres.addSlide({ masterName: "MASTER_SLIDE" });
                        
                        // 상단 제목 
                        slideP.addText("확인 및 연습", { 
                            x: X_MARGIN, y: 0.45, w: W_CONTENT, h: 0.4, valign: 'bottom', margin: 0, color: COLOR_NAVY, fontSize: 30, bold: true, fontFace: FONT_FACE 
                        });
                        slideP.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: 0.93, w: W_CONTENT, h: 0.03, fill: COLOR_NAVY });

                        // 넓은 배경 박스 (페이지를 충분히 채우도록)
                        slideP.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: 1.2, w: W_CONTENT, h: 4.0, fill: COLOR_BG_LIGHT, line: { color: COLOR_BORDER, dashType: 'dash', width: 2 } });
                        
                        // 문항 번호 (너비를 0.95로 늘려 Q10, Q11 등 두 자릿수에도 줄바꿈 방지)
                        slideP.addText(`Q${pIdx + 1}.`, { x: 0.7, y: 1.4, w: 0.95, h: 0.5, color: COLOR_NAVY, fontSize: 26, bold: true, fontFace: FONT_FACE });
                        
                        // 문제 텍스트 (22pt 적용 및 넓은 괄호 간격 유지)
                        let pText = document.getElementById(`prac-${pIdx}-txt`).innerText;
                        slideP.addText(pText, {
                            x: 1.5, y: 1.4, w: 7.7, h: 3.6, color: COLOR_BLACK, fontSize: 22, fontFace: FONT_FACE, valign: 'top', lineSpacing: 35
                        });
                    });

                    // 완료 및 저장
                    pres.writeFile({ fileName: `서울대_한국어_4A_${currentKey}.pptx` }).then(() => {
                        btn.innerHTML = '<i class="fa-solid fa-check"></i> 성공적으로 다운로드됨';
                        showMessage("🎉 PPTX 파일이 성공적으로 다운로드되었습니다!");
                        setTimeout(() => { btn.innerHTML = originalText; btn.disabled = false; }, 3000);
                    });

                } catch(e) {
                    showMessage("❌ PPTX 생성 중 오류가 발생했습니다: " + e.message);
                    console.error(e);
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            }, 100);
        }
    </script>
</body>
