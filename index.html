<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서울대 한국어 4A - 스마트 슬라이드 제너레이터</title>
    
    <!-- 폰트 및 아이콘 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Tailwind CSS (대시보드 UI용) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- PPTX 다운로드용 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/libs/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.min.js"></script>

    <style>
        /* ==================================================================
           PPTX 템플릿 렌더링 전용 CSS (V20 디자인 완벽 유지)
           ================================================================== */
        * { box-sizing: border-box; font-family: 'Malgun Gothic', '맑은 고딕', sans-serif !important; }
        
        .preview-bg {
            background-color: #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 0;
            width: 100%;
            min-height: 100vh;
        }

        .slide-wrapper {
            width: 1280px;
            height: 720px;
            transform-origin: top center;
            transform: scale(0.75); 
            margin-bottom: -180px; 
        }

        .slide-container {
            background-color: #ffffff;
            border-radius: 4px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            width: 1280px;
            height: 720px;
            overflow: hidden;
            padding: 50px 60px;
            position: relative;
            color: #000000;
        }

        .slide-container h1, .slide-container h2, .slide-container h3,
        .slide-container p, .slide-container td, .slide-container th {
            margin: 0; color: #000000; line-height: 1.4;
        }

        .slide-container .slide-title {
            font-size: 40px; font-weight: bold; color: #27408B; 
            text-align: left; width: 100%; border-bottom: 3px solid #27408B;
            padding-bottom: 8px; margin-bottom: 30px;
        }

        .content-area { display: flex; flex-direction: column; flex-grow: 1; width: 100%; }

        [contenteditable="true"] { outline: none; transition: background-color 0.2s, box-shadow 0.2s; border-radius: 4px; padding: 2px 4px; }
        [contenteditable="true"]:hover { background-color: rgba(59, 130, 246, 0.05); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); cursor: text; }
        [contenteditable="true"]:focus { background-color: rgba(59, 130, 246, 0.1); box-shadow: 0 0 0 2px #3b82f6; }

        /* Slide 1: 표지 */
        .slide1-layout { text-align: center; display: flex; flex-direction: column; width: 100%; height: 100%; position: relative; }
        .slide1-layout .subtitle { position: absolute; top: 20px; right: 0px; font-size: 32px; color: #64748b; font-weight: bold; }
        .slide1-navy-box { background-color: #27408B; width: 1280px; position: absolute; top: 150px; left: -60px; padding: 20px 0; text-align: center; }
        .slide1-navy-box .main-title { font-size: 54px; color: #ffffff; font-weight: bold; margin: 0; }
        .slide1-layout .grammar-points { position: absolute; top: 310px; width: 100%; text-align: center; font-size: 35px; line-height: 1.6; font-weight: bold; }
        .pos-text { color: #27408B; font-weight: bold; } 

        /* Slide 2: 도입 */
        .two-column { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; width: 100%; height: 100%; }
        .dialogue-box { background-color: #f8fafc; padding: 40px; display: flex; flex-direction: column; justify-content: center; height: 480px; }
        .dialogue-box p { font-size: 32px; margin-bottom: 30px; color: #000000; }
        .image-placeholder { background-color: #e2e8f0; display: flex; justify-content: center; align-items: center; text-align: center; height: 480px; padding: 20px; }
        .image-placeholder p { font-size: 26px; color: #64748b; font-weight: bold; }

        /* Slide 3: 의미와 예문 */
        .meaning-layout { display: flex; flex-direction: column; gap: 40px; width: 100%; }
        .meaning-layout .section-title { font-size: 32px; color: #27408B; font-weight: bold; margin-bottom: 15px; }
        .meaning-layout p.meaning-text { font-size: 32px; margin-bottom: 10px; }
        .meaning-layout p.example-text { font-size: 29px; margin-bottom: 15px; white-space: pre-wrap; }

        /* Tables */
        .table-wrapper { width: 100%; display: flex; justify-content: center; }
        table { border-collapse: collapse; width: 95%; border: 1px solid #cbd5e1; }
        th, td { border: 1px solid #cbd5e1; padding: 12px 15px; text-align: center; vertical-align: middle; font-size: 28px; }
        th { background-color: #27408B; color: #ffffff !important; font-weight: bold; }
        .sub-pos { font-size: 20px; color: #64748b; font-weight: normal; }
        .no-bottom-border { border-bottom: none !important; }
        .no-top-border { border-top: none !important; }

        /* 연습문제 */
        .practice-wrapper { display: flex; flex-direction: row; width: 100%; height: 440px; gap: 20px; align-items: flex-start; padding-top: 10px; }
        .practice-num { font-size: 36px; font-weight: bold; color: #27408B; min-width: 90px; white-space: nowrap; margin-top: 10px; }
        .practice-box { flex-grow: 1; background-color: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 12px; padding: 40px; font-size: 26px; color: #000000; line-height: 1.8; white-space: pre-wrap; height: 100%; width: 100%; overflow: hidden; }

        /* 알림 모달 */
        #customModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 24px; border-radius: 12px; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    </style>
</head>
<body class="bg-slate-100 text-slate-800">

    <!-- 1. 메인 대시보드 화면 -->
    <div id="dashboard-screen" class="w-full min-h-screen flex flex-col">
        <div class="w-full bg-blue-900 text-white px-8 py-5 flex justify-between items-center shadow-md sticky top-0 z-50">
            <h1 class="text-2xl font-bold">서울대 한국어 4A <span class="text-blue-300 text-base font-normal ml-2">스마트 슬라이드 제너레이터</span></h1>
        </div>

        <div class="max-w-7xl w-full mx-auto p-8">
            <p class="text-slate-600 mb-8 text-center text-lg">원하시는 단원의 버튼을 클릭하면 PPTX 템플릿이 자동으로 생성되며, 편집 및 다운로드가 가능합니다.</p>
            <div id="dashboard-grid" class="w-full">
                <!-- Javascript로 그리드 버튼 자동 생성됨 -->
            </div>
        </div>
    </div>

    <!-- 2. PPTX 미리보기 및 편집 화면 -->
    <div id="preview-screen" class="w-full hidden flex-col">
        <div class="w-full bg-blue-900 text-white px-8 py-4 flex justify-between items-center shadow-md sticky top-0 z-50">
            <h1 class="text-xl font-bold" id="preview-header-title">미리보기 편집</h1>
            <div class="flex gap-4">
                <button onclick="showScreen('dashboard-screen')" class="bg-slate-600 text-white px-5 py-2 rounded-lg font-bold hover:bg-slate-500 transition shadow"><i class="fa-solid fa-house mr-1"></i> 홈으로</button>
                <button id="downloadBtn" onclick="downloadPPTX()" class="bg-emerald-600 text-white px-5 py-2 rounded-lg font-bold hover:bg-emerald-500 transition shadow"><i class="fa-solid fa-file-powerpoint mr-1"></i> PPTX 다운로드</button>
            </div>
        </div>
        <div class="w-full text-center py-3 bg-blue-50 border-b border-blue-100 text-blue-800 text-sm shadow-inner font-medium">
            <i class="fa-solid fa-pen-to-square mr-1"></i> 슬라이드 화면의 텍스트를 마우스로 클릭하여 바로 수정할 수 있습니다. 수정 후 우측 상단의 다운로드 버튼을 누르세요.
        </div>
        
        <div class="preview-bg" id="previewArea">
            <!-- 동적 렌더링 영역 -->
        </div>
    </div>

    <!-- 커스텀 모달 -->
    <div id="customModal">
        <div class="modal-content">
            <p id="modalMessage" class="text-lg font-bold text-slate-800 mb-6"></p>
            <button onclick="closeModal()" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold w-full hover:bg-blue-700 transition">확인</button>
        </div>
    </div>

    <!-- Firebase 없이 순수 JS로 작동하는 안전한 스크립트 -->
    <script>
        // 전역 UI 제어 함수
        window.showScreen = function(screenId) {
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('preview-screen').classList.add('hidden');
            document.getElementById('preview-screen').classList.remove('flex');
            
            let target = document.getElementById(screenId);
            target.classList.remove('hidden');
            if (screenId === 'preview-screen') {
                target.classList.add('flex');
            }
        };

        window.showModal = function(msg) {
            document.getElementById('modalMessage').innerText = msg;
            document.getElementById('customModal').style.display = 'flex';
        };

        window.closeModal = function() {
            document.getElementById('customModal').style.display = 'none';
        };

        // 데이터베이스 (전체 단원 뼈대 생성)
        const db = {
            "1-1-1": {
                unitLabel: "1단원. 진로와 적성 (1-1. 진로)",
                grammarParts: [
                    { pos: "V", text: "-는다면서(요)?" },
                    { pos: "A", text: "-다면서(요)?" },
                    { pos: "N", text: "(이)라면서(요)?" }
                ],
                intro: {
                    speakerA: "가: 오늘 교수님과 상담을 한다면서요?",
                    speakerB: "나: 네. 아직 진로를 정하지 못해서 교수님과 이야기해 보려고요."
                },
                meaning: "다른 사람에게 듣거나 이미 알고 있는 사실을 확인할 때 사용합니다.",
                examples: [
                    "가: 방학에 부산에 간다면서요?\n나: 네. 오랜만에 부산에 사는 친구를 만나려고요.",
                    "가: 한국은 과일값이 비싸다면서요?\n나: 네. 너무 비싸서 자주 사 먹기 힘들어요."
                ],
                tables: [
                    {
                        title: "문법 형태 (1) : 동사",
                        headers: ["결합 형태", "기본형", "활용형"],
                        rows: [
                            [ { pos: "V", text: "-는다면서(요)?\n/-다면서(요)?", rowspan: 2 }, "가다", "간다면서요?" ],
                            [ null, "먹다", "먹는다면서요?" ]
                        ]
                    },
                    {
                        title: "문법 형태 (2) : 형용사",
                        headers: ["결합 형태", "기본형", "활용형"],
                        rows: [
                            [ { pos: "A", text: "-다면서(요)?", rowspan: 2 }, "비싸다", "비싸다면서요?" ],
                            [ null, "재미있다", "재미있다면서요?" ]
                        ]
                    },
                    {
                        title: "문법 형태 (3) : 명사",
                        headers: ["결합 형태", "기본형", "활용형"],
                        rows: [
                            [ { pos: "N", text: "(이)라면서(요)?", rowspan: 2 }, "친구", "친구라면서요?" ],
                            [ null, "생일", "생일이라면서요?" ]
                        ]
                    },
                    {
                        title: "문법 형태 (4) : 과거 / 미래",
                        headers: ["결합 형태", "기본형", "활용형"],
                        rows: [
                            [ { pos: "V, A", text: "-었/았다면서(요)?", rowspan: 3 }, "보다", "봤다면서요?" ],
                            [ null, "길다", "길었다면서요?" ],
                            [ null, "잘하다", "잘했다면서요?" ],
                            [ { pos: "N", text: "(이)었다면서(요)?", rowspan: 2 }, "친구", "친구였다면서요?" ],
                            [ null, "생일", "생일이었다면서요?" ],
                            [ { pos: "V, A", text: "-(으)ㄹ 거라면서(요)?", rowspan: 2 }, "취업하다", "취업할 거라면서요?" ],
                            [ null, "읽다", "읽을 거라면서요?" ]
                        ]
                    }
                ],
                practices: [
                    "대화를 완성해 보세요.\n\n가: 테오 씨, 내일 발표를 한다면서요? 준비는 잘돼 가요?\n나: 열심히 하고 있는데 쉽지 않네요.\n\n[힌트] 테오 씨가 내일 발표를 한대요.",
                    "대화를 완성해 보세요.\n\n가: 나나 씨, (                                                  )?\n     다음 주에 제주도에 갈 건데 어디에 가면 좋을까요?\n나: 성산일출봉에 한번 가 보세요. 아주 아름다워요.",
                    "대화를 완성해 보세요.\n\n가: 민우야, (                                                  )? 어떤 사람을 좋아해?\n나: 응. 나는 내 이야기를 잘 들어 주는 사람이 좋더라."
                ]
            },
            "1-1-2": {
                unitLabel: "1단원. 진로와 적성 (1-1. 진로)",
                grammarParts: [ { pos: "V", text: "-다(가) 보면" } ],
                intro: {
                    speakerA: "가: 요즘 수영을 배우기 시작했는데 너무 재미있어요.\n     그런데 아직 조금밖에 못 가요.",
                    speakerB: "나: 걱정하지 마세요.\n     계속 연습하다가 보면 더 멀리 갈 수 있을 거예요."
                },
                meaning: "앞의 행동을 계속하면 나중에 뒤의 결과가 생길 수 있다는 것을 말할 때 사용합니다.",
                examples: [
                    "가: 저는 요리에 소질이 없나 봐요. 제가 만든 요리는 너무 맛이 없어요.\n나: 자주 요리를 하다 보면 지금보다 잘하게 될 거예요.",
                    "가: 한국 음식은 너무 매워서 먹을 때마다 좀 힘들어요.\n나: 한국 음식이 좀 맵지만 계속 먹다 보면 익숙해질 거예요."
                ],
                tables: [
                    {
                        title: "문법 형태",
                        headers: ["결합 형태", "기본형", "활용형"],
                        rows: [
                            [ { pos: "V", text: "-다(가) 보면", rowspan: 2 }, "연습하다", "연습하다가 보면" ],
                            [ null, "먹다", "먹다가 보면" ]
                        ]
                    }
                ],
                practices: [
                    "대화를 완성해 보세요.\n\n가: 김치가 맛있는데 저한테는 좀 매운 것 같아요.\n나: 처음에는 좀 맵지만 (                                                  ) 괜찮아질 거예요. 나도 그랬어요."
                ]
            }
        };

        const unitTitles = {
            1: ["진로", "능력과 자질"], 2: ["질병과 증상", "건강한 습관"], 3: ["만족과 후회", "사회 변화"],
            4: ["날씨와 기후", "기후와 문화의 특징"], 5: ["아름다운 풍경", "여행의 기쁨"], 6: ["함께 즐기는 축제", "감상과 평가"],
            7: ["조사 결과", "통계와 그래프"], 8: ["스타와 대중문화", "대중문화의 영향"], 9: ["흥미진진한 경기", "경기와 규칙"]
        };

        for (let u = 1; u <= 9; u++) {
            for (let p = 1; p <= 2; p++) {
                for (let g = 1; g <= 2; g++) {
                    let key = `${u}-${p}-${g}`;
                    if (!db[key]) {
                        db[key] = {
                            unitLabel: `${u}단원. ${unitTitles[u][p-1]} (${u}-${p})`,
                            grammarParts: [ { pos: "", text: `${u}-${p}-${g} 문법 내용 입력란` } ],
                            intro: { speakerA: "가: 대화문 입력", speakerB: "나: 대화문 입력" },
                            meaning: "여기에 문법의 의미를 입력하세요.",
                            examples: [ "가: 예문 1\n나: 대답 1" ],
                            tables: [
                                {
                                    title: "문법 형태",
                                    headers: ["결합 형태", "기본형", "활용형"],
                                    rows: [
                                        [ { pos: "V", text: "동사 형태", rowspan: 1 }, "기본형", "활용형 입력" ]
                                    ]
                                }
                            ],
                            practices: [
                                "가: 연습문제를 입력하세요.\n나: 빈칸을 (                                                  ) 채워보세요."
                            ]
                        };
                    }
                }
            }
        }

        const reviews = ["1-3", "4-6", "7-9"];
        reviews.forEach((r) => {
            let key = `review-${r}`;
            db[key] = {
                unitLabel: `복습 ${r}과`,
                grammarParts: [ { pos: "", text: `복습 ${r}과 문제풀이` } ],
                intro: { speakerA: "가: 복습 대화문 입력", speakerB: "나: 대화문 입력" },
                meaning: "배운 내용을 다시 확인해 봅시다.",
                examples: [ "복습 예문 입력 공간" ],
                tables: [],
                practices: [ `복습 ${r}과 연습문제 1 (문제를 자유롭게 입력하세요.)` ]
            };
        });

        // 윈도우 로드 시 실행
        window.onload = function() {
            const gridContainer = document.getElementById('dashboard-grid');
            let html = '';

            for(let i=1; i<=9; i++) {
                html += `
                <div class="mb-10 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="text-2xl font-bold text-blue-900 mb-6 border-b-2 border-blue-900 pb-2">${i}단원. ${unitTitles[i][0].split(' ')[0]}</h3>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <button onclick="window.openPreview('${i}-1')" class="bg-blue-50 text-blue-800 border border-blue-200 hover:bg-blue-600 hover:text-white hover:border-blue-600 py-3 rounded-lg font-bold transition shadow-sm">${i}-1과 문법</button>
                        <button onclick="window.openPreview('${i}-1-v')" class="bg-slate-50 text-slate-700 border border-slate-200 hover:bg-slate-600 hover:text-white py-3 rounded-lg font-medium transition shadow-sm">${i}-1과 어휘</button>
                        <button onclick="window.openPreview('${i}-2')" class="bg-blue-50 text-blue-800 border border-blue-200 hover:bg-blue-600 hover:text-white hover:border-blue-600 py-3 rounded-lg font-bold transition shadow-sm">${i}-2과 문법</button>
                        <button onclick="window.openPreview('${i}-2-v')" class="bg-slate-50 text-slate-700 border border-slate-200 hover:bg-slate-600 hover:text-white py-3 rounded-lg font-medium transition shadow-sm">${i}-2과 어휘</button>
                    </div>
                </div>`;
            }

            html += `
                <div class="mb-10 bg-indigo-50 p-6 rounded-xl shadow-sm border border-indigo-200">
                    <h3 class="text-2xl font-bold text-indigo-900 mb-6 border-b-2 border-indigo-900 pb-2">복습 과제 (Workbook)</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <button onclick="window.openPreview('review-1-3')" class="bg-indigo-600 text-white hover:bg-indigo-700 py-3 rounded-lg font-bold transition shadow-sm">1-3과 복습</button>
                        <button onclick="window.openPreview('review-4-6')" class="bg-indigo-600 text-white hover:bg-indigo-700 py-3 rounded-lg font-bold transition shadow-sm">4-6과 복습</button>
                        <button onclick="window.openPreview('review-7-9')" class="bg-indigo-600 text-white hover:bg-indigo-700 py-3 rounded-lg font-bold transition shadow-sm">7-9과 복습</button>
                    </div>
                </div>`;

            gridContainer.innerHTML = html;
            window.showScreen('dashboard-screen');
        };

        let activeKey = "";

        window.openPreview = function(key) {
            activeKey = key;
            const container = document.getElementById("previewArea");
            container.innerHTML = "";
            let html = "";
            let titleText = "";

            if (key.includes('-v')) {
                let parts = key.split('-');
                let u = parts[0], l = parts[1];
                titleText = `${u}단원. ${unitTitles[u][l-1]} (${u}-${l}. 어휘)`;
                document.getElementById('preview-header-title').innerText = titleText;
                
                html += generateTitleHtml(titleText, "어휘 Vocabulary", []);
                html += generateVocabHtml();
            } else if (key.startsWith('review-')) {
                let ranges = key.split('-').slice(1).join('-');
                titleText = `${ranges}과 복습 (Workbook)`;
                document.getElementById('preview-header-title').innerText = titleText;
                
                html += generateTitleHtml(titleText, "복습", []);
                html += generateReviewHtml();
            } else {
                let parts = key.split('-');
                let u = parts[0], l = parts[1];
                titleText = `${u}단원. ${unitTitles[u][l-1]} (${u}-${l}. 문법)`;
                document.getElementById('preview-header-title').innerText = titleText;

                let g1 = db[`${u}-${l}-1`];
                let g2 = db[`${u}-${l}-2`];

                let gList = [];
                if(g1) gList.push(g1);
                if(g2) gList.push(g2);

                html += generateTitleHtml(titleText, "문법과 표현", gList);

                if(g1) html += generateGrammarHtml(g1, 1);
                if(g2) html += generateGrammarHtml(g2, 2);
            }

            container.innerHTML = html;
            window.showScreen('preview-screen');
            window.scrollTo(0,0);
        };

        function generateTitleHtml(subtitle, main, gList) {
            let listHtml = gList.map((g, i) => {
                let posSpan = g.pos ? `<span class="pos-text">${g.pos}</span> ` : "";
                return `<div id="title-g-${i}" contenteditable="true">${posSpan}${g.text.replace(/\n/g, '')}</div>`;
            }).join('');

            return `
                <div class="slide-wrapper" id="slide-1">
                    <div class="slide-container" style="border-top: none;">
                        <div class="slide1-layout">
                            <div class="subtitle" id="title-sub" contenteditable="true">${subtitle}</div>
                            <div class="slide1-navy-box">
                                <div class="main-title" id="title-main" contenteditable="true">${main}</div>
                            </div>
                            <div class="grammar-points">
                                ${listHtml}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function generateVocabHtml() {
            return `
                <div class="slide-wrapper" id="slide-vocab">
                    <div class="slide-container">
                        <div class="slide-title" id="vocab-title" contenteditable="true">어휘 학습</div>
                        <div class="content-area">
                            <div class="practice-box" id="vocab-content" contenteditable="true" style="height:480px;">여기에 어휘와 의미를 입력하세요.</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function generateReviewHtml() {
            return `
                <div class="slide-wrapper" id="slide-review">
                    <div class="slide-container">
                        <div class="slide-title" id="review-title" contenteditable="true">확인 및 연습</div>
                        <div class="content-area">
                            <div class="practice-box" id="review-content" contenteditable="true" style="height:480px;">여기에 복습 문제를 입력하세요.</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function generateGrammarHtml(g, gIdx) {
            let html = "";
            
            html += `
                <div class="slide-wrapper">
                    <div class="slide-container">
                        <div class="slide-title" id="intro-${gIdx}-title" contenteditable="true">도입 상황</div>
                        <div class="content-area">
                            <div class="two-column">
                                <div class="dialogue-box">
                                    <p id="intro-${gIdx}-a" contenteditable="true">${g.intro.speakerA.replace(/\n/g, '<br>')}</p>
                                    <p id="intro-${gIdx}-b" contenteditable="true" style="margin-bottom: 0;">${g.intro.speakerB.replace(/\n/g, '<br>')}</p>
                                </div>
                                <div class="image-placeholder">
                                    <p id="intro-${gIdx}-img" contenteditable="true">[PDF 원본에서 그림을 복사하여<br>이곳에 붙여넣으세요]</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            let exHTML = g.examples.map((ex, i) => 
                `<div class="example-text" id="mean-${gIdx}-ex-${i}" contenteditable="true" style="margin-bottom: 25px;">${ex.replace(/\n/g, '<br>')}</div>`
            ).join('');

            html += `
                <div class="slide-wrapper">
                    <div class="slide-container">
                        <div class="slide-title" id="mean-${gIdx}-title" contenteditable="true">의미와 예문</div>
                        <div class="content-area">
                            <div class="meaning-layout">
                                <div>
                                    <div class="section-title" contenteditable="true"><i class="fa-solid fa-lightbulb"></i> 의미</div>
                                    <p id="mean-${gIdx}-desc" contenteditable="true">${g.meaning}</p>
                                </div>
                                <div>
                                    <div class="section-title" contenteditable="true"><i class="fa-solid fa-comments"></i> 예문</div>
                                    <div>${exHTML}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            if (g.tables && g.tables.length > 0) {
                g.tables.forEach((tbl, tIdx) => {
                    let trs = "";
                    tbl.rows.forEach((row, rIdx) => {
                        trs += "<tr>";
                        if(row[0] !== null) {
                            let posHtml = row[0].pos ? `<span class="pos-text">${row[0].pos}</span> ` : "";
                            trs += `<td rowspan="${row[0].rowspan}" id="tbl-${gIdx}-${tIdx}-r${rIdx}-c0" contenteditable="true">
                                        ${posHtml}${row[0].text.replace(/\n/g, '<br>')}
                                    </td>`;
                        }
                        trs += `<td id="tbl-${gIdx}-${tIdx}-r${rIdx}-c1" contenteditable="true">${row[1]}</td>`;
                        trs += `<td id="tbl-${gIdx}-${tIdx}-r${rIdx}-c2" contenteditable="true">${row[2]}</td>`;
                        trs += "</tr>";
                    });

                    html += `
                        <div class="slide-wrapper" id="slide-tbl-${tIdx}">
                            <div class="slide-container">
                                <div class="slide-title" id="tbl-${gIdx}-${tIdx}-title" contenteditable="true">${tbl.title}</div>
                                <div class="content-area">
                                    <div class="table-wrapper">
                                        <table>
                                            <thead>
                                                <tr>
                                                    <th style="width: 40%;" contenteditable="true">${tbl.headers[0]}</th>
                                                    <th style="width: 25%;" contenteditable="true">${tbl.headers[1]}</th>
                                                    <th style="width: 35%;" contenteditable="true">${tbl.headers[2]}</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                ${trs}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            if (g.practices && g.practices.length > 0) {
                g.practices.forEach((prac, pIdx) => {
                    let qNum = pIdx + 1;
                    html += `
                        <div class="slide-wrapper" id="slide-prac-${gIdx}-${pIdx}">
                            <div class="slide-container">
                                <div class="slide-title" contenteditable="true">확인 및 연습</div>
                                <div class="content-area">
                                    <div class="practice-wrapper">
                                        <div class="practice-num" contenteditable="true">Q${qNum}.</div>
                                        <div class="practice-box" id="prac-${gIdx}-${pIdx}-txt" contenteditable="true">${prac.replace(/\n/g, '<br>')}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            return html;
        }

        window.downloadPPTX = function() {
            let btn = document.getElementById('downloadBtn');
            let originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> 파일 생성 중...';
            btn.disabled = true;

            setTimeout(() => {
                try {
                    let pres = new PptxGenJS();
                    pres.layout = 'LAYOUT_16x9'; 
                    
                    let COLOR_NAVY = "27408B";
                    let COLOR_BLACK = "000000";
                    let COLOR_GRAY_TITLE = "64748B";
                    let COLOR_BORDER = "CBD5E1";
                    let COLOR_BG_LIGHT = "F8FAFC"; 
                    let COLOR_BG_DARK = "E2E8F0";
                    let FONT_FACE = "맑은 고딕";
                    
                    let X_MARGIN = 0.625; 
                    let W_CONTENT = 8.75; 

                    pres.defineSlideMaster({
                        title: "MASTER_SLIDE",
                        background: { fill: "FFFFFF" }
                    });

                    function getText(id) {
                        let el = document.getElementById(id);
                        if(!el) return "";
                        return el.innerText || "";
                    }

                    function addSlideTitle(slide, textId) {
                        let txt = getText(textId) || "제목";
                        slide.addText(txt, { x: X_MARGIN, y: 0.45, w: W_CONTENT, h: 0.4, valign: 'bottom', margin: 0, color: COLOR_NAVY, fontSize: 30, bold: true, fontFace: FONT_FACE });
                        slide.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: 0.93, w: W_CONTENT, h: 0.03, fill: COLOR_NAVY });
                    }

                    // --- 1 ---
                    let slide1 = pres.addSlide();
                    slide1.addText(getText("title-sub"), { x: 4.0, y: 0.3, w: 5.375, align: 'right', color: COLOR_GRAY_TITLE, fontSize: 24, bold: true, fontFace: FONT_FACE });
                    slide1.addShape(pres.ShapeType.rect, { x: 0, y: 1.9, w: 10, h: 1.2, fill: COLOR_NAVY });
                    slide1.addText(getText("title-main"), { x: 0, y: 1.9, w: 10, h: 1.2, align: 'center', valign: 'middle', color: "FFFFFF", fontSize: 50, bold: true, fontFace: FONT_FACE });
                    
                    let gTextArr = [];
                    for(let i=0; i<5; i++) {
                        let fullText = getText(`title-g-${i}`);
                        if(fullText) {
                            let firstSpace = fullText.indexOf(' ');
                            let pos = firstSpace > -1 ? fullText.substring(0, firstSpace) : fullText;
                            let rest = firstSpace > -1 ? fullText.substring(firstSpace) : "";
                            gTextArr.push({ text: pos + " ", options: { color: COLOR_NAVY, bold: true } });
                            gTextArr.push({ text: rest + "\n", options: { color: COLOR_BLACK, bold: false } });
                        }
                    }
                    if(gTextArr.length > 0) {
                        slide1.addText(gTextArr, { x: 0, y: 3.5, w: 10, h: 2.0, align: 'center', valign: 'top', fontSize: 26, fontFace: FONT_FACE, lineSpacing: 45 });
                    }

                    if (activeKey.includes('-v')) {
                        let slideV = pres.addSlide({ masterName: "MASTER_SLIDE" });
                        addSlideTitle(slideV, "vocab-title");
                        slideV.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: 1.25, w: 8.3, h: 4.1, fill: COLOR_BG_LIGHT, line: { color: COLOR_BORDER, dashType: 'dash', width: 2 } });
                        slideV.addText(getText("vocab-content"), { x: 0.8, y: 1.4, w: 7.8, h: 3.8, color: COLOR_BLACK, fontSize: 22, fontFace: FONT_FACE, valign: 'top', wrap: true });
                    } 
                    else if (activeKey.startsWith('review-')) {
                        let slideR = pres.addSlide({ masterName: "MASTER_SLIDE" });
                        addSlideTitle(slideR, "review-title");
                        slideR.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: 1.25, w: 8.3, h: 4.1, fill: COLOR_BG_LIGHT, line: { color: COLOR_BORDER, dashType: 'dash', width: 2 } });
                        slideR.addText(getText("review-content"), { x: 0.8, y: 1.4, w: 7.8, h: 3.8, color: COLOR_BLACK, fontSize: 22, fontFace: FONT_FACE, valign: 'top', wrap: true });
                    } 
                    else {
                        [1, 2].forEach(gIdx => {
                            if(!document.getElementById(`intro-${gIdx}-a`)) return;

                            let slide2 = pres.addSlide({ masterName: "MASTER_SLIDE" });
                            addSlideTitle(slide2, `intro-${gIdx}-title`);
                            slide2.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: 1.3, w: 4.15, h: 3.9, fill: COLOR_BG_LIGHT });
                            slide2.addText(getText(`intro-${gIdx}-a`) + "\n\n" + getText(`intro-${gIdx}-b`), { x: 0.8, y: 1.3, w: 3.8, h: 3.9, color: COLOR_BLACK, fontSize: 24, fontFace: FONT_FACE, valign: 'middle', lineSpacing: 35 });
                            slide2.addShape(pres.ShapeType.rect, { x: 5.125, y: 1.3, w: 4.25, h: 3.9, fill: COLOR_BG_DARK });
                            slide2.addText(getText(`intro-${gIdx}-img`), { x: 5.125, y: 1.3, w: 4.25, h: 3.9, color: COLOR_GRAY_TITLE, fontSize: 20, fontFace: FONT_FACE, align: 'center', valign: 'middle', bold: true });

                            let slide3 = pres.addSlide({ masterName: "MASTER_SLIDE" });
                            addSlideTitle(slide3, `mean-${gIdx}-title`);
                            slide3.addText("의미", { x: X_MARGIN, y: 1.3, w: W_CONTENT, h: 0.4, color: COLOR_NAVY, fontSize: 24, bold: true, fontFace: FONT_FACE, valign: 'top' });
                            slide3.addText(getText(`mean-${gIdx}-desc`), { x: X_MARGIN, y: 1.8, w: W_CONTENT, h: 0.6, color: COLOR_BLACK, fontSize: 22, fontFace: FONT_FACE, valign: 'top' });
                            slide3.addText("예문", { x: X_MARGIN, y: 2.6, w: W_CONTENT, h: 0.4, color: COLOR_NAVY, fontSize: 24, bold: true, fontFace: FONT_FACE, valign: 'top' });
                            
                            let exArr = [];
                            for(let i=0; i<10; i++) {
                                let exTxt = getText(`mean-${gIdx}-ex-${i}`);
                                if(exTxt) exArr.push({ text: exTxt + "\n\n", options: { color: COLOR_BLACK } });
                            }
                            slide3.addText(exArr, { x: X_MARGIN, y: 3.1, w: W_CONTENT, h: 2.0, fontSize: 22, fontFace: FONT_FACE, lineSpacing: 32, valign: 'top', wrap: false });

                            let thOpts = { fill: COLOR_NAVY, color: "FFFFFF", bold: true, fontSize: 22, fontFace: FONT_FACE, align: "center", valign: "middle", border: { pt: 1, color: COLOR_BORDER }, margin: 6 };
                            function txt(content, bOpts) { return { text: content, options: { color: COLOR_BLACK, fontSize: 22, fontFace: FONT_FACE, align: "center", valign: "middle", border: bOpts } }; }
                            function posTxt(posStr, content, bOpts) { return { text: [{ text: posStr + " ", options: { color: COLOR_NAVY, bold: true } }, { text: content, options: { color: COLOR_BLACK, bold: false } }], options: { fontSize: 22, fontFace: FONT_FACE, align: "center", valign: "middle", border: bOpts } }; }

                            for(let tIdx=0; tIdx<5; tIdx++) {
                                if(!document.getElementById(`tbl-${gIdx}-${tIdx}-title`)) continue;
                                
                                let slideT = pres.addSlide();
                                addSlideTitle(slideT, `tbl-${gIdx}-${tIdx}-title`);

                                let rows = [];
                                let theads = document.querySelectorAll(`#slide-tbl-${tIdx} th`);
                                if(theads.length >= 3) {
                                    rows.push([
                                        { text: theads[0].innerText, options: thOpts }, 
                                        { text: theads[1].innerText, options: thOpts }, 
                                        { text: theads[2].innerText, options: thOpts }
                                    ]);
                                } else {
                                    rows.push([{text:"결합 형태", options:thOpts}, {text:"기본형", options:thOpts}, {text:"활용형", options:thOpts}]);
                                }

                                let borderOpts = [ {pt:1, color:COLOR_BORDER}, {pt:1, color:COLOR_BORDER}, {pt:1, color:COLOR_BORDER}, {pt:1, color:COLOR_BORDER} ];
                                let borderNoBot = [ {pt:1, color:COLOR_BORDER}, {pt:1, color:COLOR_BORDER}, {pt:0}, {pt:1, color:COLOR_BORDER} ];
                                let borderNoTop = [ {pt:0}, {pt:1, color:COLOR_BORDER}, {pt:1, color:COLOR_BORDER}, {pt:1, color:COLOR_BORDER} ];

                                for(let rIdx=0; rIdx<15; rIdx++) {
                                    let c1 = getText(`tbl-${gIdx}-${tIdx}-r${rIdx}-c1`);
                                    let c2 = getText(`tbl-${gIdx}-${tIdx}-r${rIdx}-c2`);
                                    if(!c1 && !c2) continue; 

                                    let tr = [];
                                    let cell0 = document.getElementById(`tbl-${gIdx}-${tIdx}-r${rIdx}-c0`);
                                    if (cell0) {
                                        let rspan = cell0.getAttribute('rowspan') || 1;
                                        let fullCellText = cell0.innerText;
                                        let firstSpace = fullCellText.indexOf(' ');
                                        let posPart = firstSpace > -1 ? fullCellText.substring(0, firstSpace) : fullCellText;
                                        let restPart = firstSpace > -1 ? fullCellText.substring(firstSpace) : "";
                                        
                                        tr.push(posTxt(posPart, restPart, rspan > 1 ? borderNoBot : borderOpts));
                                    } else {
                                        tr.push(txt("", borderNoTop)); 
                                    }
                                    tr.push(txt(c1, borderOpts));
                                    tr.push(txt(c2, borderOpts));
                                    rows.push(tr);
                                }
                                slideT.addTable(rows, { x: X_MARGIN, y: 1.3, w: W_CONTENT, colW: [3.5, 2.0, 3.25] });
                            }

                            for(let pIdx=0; pIdx<30; pIdx++) {
                                let pTxt = getText(`prac-${gIdx}-${pIdx}-txt`);
                                if(!pTxt) continue;

                                let slideP = pres.addSlide();
                                slideP.addText("확인 및 연습", { x: X_MARGIN, y: 0.45, w: W_CONTENT, h: 0.4, valign: 'bottom', margin: 0, color: COLOR_NAVY, fontSize: 30, bold: true, fontFace: FONT_FACE });
                                slideP.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: 0.93, w: W_CONTENT, h: 0.03, fill: COLOR_NAVY });

                                slideP.addText(`Q${pIdx + 1}.`, { x: 0.3, y: 1.3, w: 0.95, h: 0.5, color: COLOR_NAVY, fontSize: 26, bold: true, fontFace: FONT_FACE, valign: 'top' });
                                slideP.addShape(pres.ShapeType.rect, { x: 1.25, y: 1.25, w: 8.3, h: 4.1, fill: COLOR_BG_LIGHT, line: { color: COLOR_BORDER, dashType: 'dash', width: 2 } });
                                slideP.addText(pTxt, { x: 1.5, y: 1.4, w: 7.8, h: 3.8, color: COLOR_BLACK, fontSize: 22, fontFace: FONT_FACE, valign: 'top', lineSpacing: 35, wrap: true });
                            }
                        });
                    }

                    let safeTitle = activeKey.replace(/[<>:"\/\\|?*\x00-\x1F]/g, "_");
                    pres.writeFile({ fileName: `SNU_Korean_4A_${safeTitle}.pptx` }).then(() => {
                        btn.innerHTML = '<i class="fa-solid fa-check mr-2"></i> 다운로드 완료';
                        window.showModal("🎉 성공적으로 다운로드되었습니다.");
                        setTimeout(() => { btn.innerHTML = originalText; btn.disabled = false; }, 3000);
                    });

                } catch(e) {
                    window.showModal("❌ 오류 발생: " + e.message);
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    console.error(e);
                }
            }, 100);
        };
    </script>
