    <script>
        function showScreen(id) {
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('preview-screen').classList.add('hidden');
            document.getElementById('preview-screen').classList.remove('flex');
            let target = document.getElementById(id);
            target.classList.remove('hidden');
            if (id === 'preview-screen') target.classList.add('flex');
        }
        function showModal(msg) { document.getElementById('modalMessage').innerText = msg; document.getElementById('customModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('customModal').style.display = 'none'; }

        // ===================================================================
        // 종합 복습 데이터 (1~9단원 전체)
        // ===================================================================
        window.reviewDB = {
            "review-1-3": [
                { type: "말하기", title: "1. 어휘의 의미를 설명해 보세요.", isList: true, content: [{ t: "1단원", words: ["진로를 정하다", "창업하다", "소질이 있다/없다", "적성에 맞다/안 맞다", "진로를 고민하다", "대학원에 진학하다", "전공을 살리다", "전망이 밝다/어둡다", "진로를 바꾸다", "취업하다", "공감 능력이 뛰어나다", "유머 감각이 있다", "긍정적", "적극적", "도전적", "창의적", "사교적", "리더십이 있다", "책임감이 강하다", "설득력이 있다"] }] },
                { type: "말하기", title: "1. 어휘의 의미를 설명해 보세요.", isList: true, content: [{ t: "2단원", words: ["가스가 차다", "피부가 가렵다", "두드러기가 나다", "얼굴에 뭐가 나다", "눈이 건조하다", "눈이 충혈되다", "재채기를 하다", "어깨가 뻣뻣하다", "목이 뻣뻣하다", "눈이 빠지다", "머리가 깨지다", "배가 터지다", "팔이 빠지다", "귀가 떨어져 나가다", "외식하다", "과식하다", "짜게 먹다", "달게 먹다", "기름진 음식을 먹다", "식사 시간이 불규칙하다", "야식을 먹다", "혈압이 높아지다", "비만이 되다", "당뇨병에 걸리다", "충치가 생기다", "위염에 걸리다"] }] },
                { type: "말하기", title: "1. 어휘의 의미를 설명해 보세요.", isList: true, content: [{ t: "3단원", words: ["만족스럽다", "보람을 느끼다", "자랑스럽다", "자신감이 생기다", "괴롭다", "실망스럽다", "후회스럽다", "엉망이다", "즐기다", "아쉽다", "생각이 반영되다", "사고방식이 변화하다", "바탕이 되다", "영향을 주다/끼치다", "영향을 받다", "비정상(적)", "비전문적", "비공개(적)", "비현실적", "비대면"] }] },
                { type: "말하기", title: "2. 어휘를 사용해서 이야기해 보세요.", q: "[출발]\n① 진로를 정했습니까? ➔ 네(②번으로) / 아니요(③번으로)\n② 그 일이 적성에 맞는 것 같습니까? ➔ 네(④번으로) / 아니요(③번으로)\n③ 어떤 일에 소질이 있습니까? ➔ (다음 칸으로)\n④ '-적'이 포함된 단어를 3개 말해 보세요. ➔ (다음 칸으로)\n⑤ 어제 과식을 했습니까? ➔ 네(⑥번으로) / 아니요(⑦번으로)\n⑥ 과식하면 어떤 증상이 나타납니까? ➔ (다음 칸으로)\n⑦ 평소에 달게 먹는 편입니까? ➔ 네(⑧번으로) / 아니요(⑨번으로)\n⑧ 음식을 달게 먹으면 어떤 문제가 나타날까요? ➔ (다음 칸으로)\n⑨ 오랜 시간 휴대폰이나 컴퓨터를 보면 어떤 문제가 생길까요? ➔ (다음 칸으로)\n⑩ 자신이 선택한 일이 후회스러웠던 적이 있습니까? ➔ 네(⑪번으로) / 아니요(⑫번으로)\n⑪ 그때 느꼈던 기분을 설명해 보세요. ➔ (다음 칸으로)\n⑫ '비-'가 포함된 단어를 3개 말해 보세요. ➔ (다음 칸으로)\n⑬ 여러분이 한국어를 공부할 때 가장 많이 영향을 받은 것에 대해 이야기해 보세요. ➔ (도착)" },
                { type: "문법", title: "3. 문법과 표현의 의미를 확인해 보세요.", q: "V-는다면서(요)?, A-다면서(요)?, N(이)라면서(요)?\n가: 한국 사람들은 김치를 자주 먹는다면서요?\n나: 네. 그래서인지 대부분의 식당에서 김치가 기본 반찬으로 나와요.\n\nV-다(가) 보면\n가: 한국어로 말하기가 너무 힘들어요.\n나: 한국어로 자꾸 이야기하다 보면 어렵지 않게 말하게 될 거예요.\n\nN은 V-는다는 것이다, N은 A-다는 것이다, N은 N(이)라는 것이다\n외국 생활의 어려운 점은 모든 것을 혼자 해결해야 한다는 것이다.\n\nN뿐만 아니라, V·A-을 뿐만 아니라, N일 뿐만 아니라\n그 가수가 인기를 끄는 이유는 노래를 잘할 뿐만 아니라 팬들과 자주 소통하기 때문이다.\n\nV·A-을 정도로, V·A-을 정도이다\n가: 여기가 그렇게 좋아요?\n나: 네. 다음 휴가 때 다시 오고 싶을 정도로 좋아요.\n\nN만 되면, V-기만 하면\n가: 저 두 사람 왜 저렇게 싸워요?\n나: 지난번 과제를 같이 하고 난 후로 만나기만 하면 싸워요.\n\nV-는 셈이다, A-은 셈이다, N인 셈이다\n일주일에 5일 이상은 운동을 하니까 거의 매일 운동하는 셈이다.\n\nV·A-을 수밖에 없다, N일 수밖에 없다\n실외에서 열리는 행사인데 태풍이 와서 행사를 취소할 수밖에 없었다.\n\nV-으려다(가)\n가: 불고기를 해 준다더니 웬 라면이에요?\n나: 불고기를 만들려다가 시간이 없어서 라면을 끓였어요.\n\nV-다(가) 보니(까)\n가: 처음 한국에 왔을 때는 김치를 못 먹더니 이제 김치를 잘 먹네요?\n나: 네. 김치를 자주 먹다 보니까 잘 먹게 됐어요.\n\nV·A-음, N임\n다음 주에 단어 시험이 있음.\n\nV-는가?, A-은가?, N인가?\n어떻게 해야 행복해질 수 있는가?" },
                { type: "말하기", title: "4. 문법과 표현을 사용해서 이야기해 보세요. (가형)", bank: "[사용 문법/표현]\n1) V·A-을 정도로   2) N만 되면, V-기만 하면   3) V-다(가) 보니(까)\n4) V-으려다(가)   5) V·A-을 뿐만 아니라, N뿐만 아니라   6) V·A-을 수밖에 없다", q: "1) 머리가 많이 아파요?\n2) 가을이라서 단풍이 아름답네요. 산에 한번 가 볼까요?\n3) 처음에는 어려웠지만 열심히 해서 잘하게 된 일이 있어요?\n4) 진로나 미래에 대한 계획을 바꾼 경험이 있어요?\n5) 밤에 잠을 자지 않으면 어떤 문제가 생깁니까?\n6) 민우 씨는 인기가 많은 것 같아요. 이유가 뭘까요?" },
                { type: "말하기", title: "4. 문법과 표현을 사용해서 이야기해 보세요. (나형)", bank: "[사용 문법/표현]\n1) V·A-을 정도로   2) N만 되면, V-기만 하면   3) V-다(가) 보니(까)\n4) V-으려다(가)   5) V·A-을 뿐만 아니라, N뿐만 아니라   6) V·A-을 수밖에 없다", q: "1) 음식을 남기면 안 돼요. 더 드세요.\n2) 봄이라서 그런지 기운도 없고 입맛도 없어요.\n3) 한국에 처음 왔을 때는 못 먹었지만 잘 먹게 된 음식이 있어요?\n4) 오랫동안 계획했던 일을 포기한 적이 있어요?\n5) 운동을 하면 어떤 점이 좋습니까?\n6) 왜 다음 학기에 휴학을 해요?" },
                { type: "말하기", title: "4. 문법과 표현을 사용해서 이야기해 보세요. (다형)", bank: "[사용 문법/표현]\n1) V·A-을 정도로   2) N만 되면, V-기만 하면   3) V-다(가) 보니(까)\n4) V-으려다(가)   5) V·A-을 뿐만 아니라, N뿐만 아니라   6) V·A-을 수밖에 없다", q: "1) 낙지볶음이 그렇게 매워요?\n2) 왜 이렇게 재채기를 해요? 감기에 걸렸어요?\n3) 처음에는 관계가 안 좋았지만 나중에 잘 지내게 된 사람이 있어요?\n4) 여행을 하다가 중간에 계획을 바꾼 적이 있어요?\n5) 우리 학교 학생 식당은 어떤 점이 좋습니까?\n6) 하기 싫지만 해야 하는 일이 있어요?" },
                { type: "듣기", title: "1. 뉴스를 듣고 알맞은 그래프를 고르세요.", q: "① 회사 일에 만족하는가? [만족스러움 43.6% / 만족스럽지 않음 56.4%]\n② 회사 일에 만족하는가? [만족스러움 36.2% / 만족스럽지 않음 33.8% / 보통 30%]\n③ 만족하는 이유는 무엇인가? [일이 비교적 쉬워서 56.4% / 일이 적성에 맞아서 36.2% / 보람을 느낄 수 있어서 28.5%]\n④ 만족하는 이유는 무엇인가? [일이 적성에 맞아서 36.2% / 보람을 느낄 수 있어서 28.5% / 일이 비교적 쉬워서 19.3%]" },
                { type: "듣기", title: "2. 대화가 끝난 후 여자가 이어서 할 행동으로 가장 알맞은 것을 고르세요.", q: "① 영화를 보러 간다.\n② 이력서를 작성한다.\n③ 선배한테 연락한다.\n④ 사진을 찍으러 간다." },
                { type: "듣기", title: "3. 대화가 끝난 후 남자가 이어서 할 행동으로 가장 알맞은 것을 고르세요.", q: "① 집으로 돌아간다.\n② 설문지를 작성한다.\n③ 자신의 이름을 알려 준다.\n④ 건강 검진을 다시 예약한다." },
                { type: "듣기", title: "4. 인터뷰를 듣고 여자의 생각으로 가장 알맞은 것을 고르세요.", q: "① 자신이 즐길 수 있는 일을 해야 된다.\n② 사람들의 인정을 받을 수 있어야 한다.\n③ 오랫동안 한 분야에서 일하면 최고가 될 수 있다.\n④ 다른 사람들에게 영향을 줄 때 보람을 느낄 수 있다." },
                { type: "듣기", title: "5. 다음을 듣고 들은 내용과 같은 것을 고르세요.", q: "① 여자는 졸업하자마자 취업했다.\n② 남자는 대학원에 진학하기로 했다.\n③ 여자는 소질을 살릴 수 있는 공부를 할 것이다.\n④ 남자는 경제학이 자신의 적성에 안 맞는다고 생각한다." },
                { type: "듣기", title: "6. 다음을 듣고 들은 내용과 같은 것을 고르세요.", q: "① 재학생은 적성 검사를 받을 수 없다.\n② 신청 기간은 4월 4일부터 일주일 동안이다.\n③ 검사 결과는 검사한 다음 날 온라인으로 알려 준다.\n④ 신청자가 많으면 원하는 날짜에 검사를 받을 수 없다." },
                { type: "듣기", title: "7. 두 사람은 무엇에 대해 이야기하고 있습니까?", q: "① 성격에 맞는 직업의 종류\n② 취업을 준비할 때 주의할 점\n③ 업무 능력을 키우기 위한 방법\n④ 회사에서 직원을 뽑을 때의 조건" },
                { type: "듣기", title: "8. 남자의 생각으로 가장 알맞은 것을 고르세요.", q: "① 성격 검사 결과를 믿을 수 없다.\n② 회사는 자신들이 원하는 직원을 뽑아야 한다.\n③ 능력보다 성격을 더 중요하게 생각해야 한다.\n④ 성격 검사보다 자기소개서와 면접이 더 효과적이다." },
                { type: "듣기", title: "9. 이 강연의 주제로 가장 알맞은 것을 고르세요.", q: "① 야식 증후군의 특성\n② 야식을 줄이는 방법\n③ 야식과 체중의 관련성\n④ 야식으로 적당한 음식" },
                { type: "듣기", title: "10. 들은 내용과 일치하는 것을 고르세요.", q: "① 물을 마시면 식욕을 줄일 수 있다.\n② 야식을 먹는 습관과 질병은 관계가 없다.\n③ 늦게 자는 사람은 야식을 먹어도 문제가 없다.\n④ 자기 힘들 정도로 배가 고파도 아무것도 안 먹는 것이 좋다." },
                { type: "읽기", title: "1. 다음 글의 내용과 같은 것을 고르세요.", passage: "제5회 건강 특강 - 여드름\n• 일시: 2023년 11월 11일(토) 오전 10시\n• 장소: 한국병원 4층 대강당\n• 참가 인원: 선착순 100명\n• 참가비: 10,000원 (한국병원 직원 50% 할인)\n• 주제: 여드름의 원인과 피부 관리 방법 소개", q: "① 이 특강은 이번에 처음으로 열린다.\n② 한국병원 환자는 참가비가 5,000원이다.\n③ 이 특강에서 여드름 관리를 받을 수 있다.\n④ 먼저 신청한 백 명만 이 특강을 들을 수 있다." },
                { type: "읽기", title: "2. 다음 글의 내용과 같은 것을 고르세요.", passage: "직장인에게 '다시 첫 직업을 선택할 수 있다면 어떤 직업을 선택하고 싶은가?'라고 질문했다. 공무원이 1위, 변호사 등 전문직이 2위였고, 3위는 IT 개발자, 4위는 교사로 나타났다. 공무원을 선택한 이유로는 안정적으로 일할 수 있을 뿐만 아니라 시간 여유가 있기 때문이라고 대답했다. 전문직을 선택한 이유는 높은 급여를 받을 수 있기 때문이었다. 이번 조사에서는 지금까지의 조사와 다르게 교사보다 IT 개발자가 되고 싶다고 대답한 사람이 많았는데 이것은 시대 변화를 보여 주는 것이다.", q: "① 많은 직장인들이 안정적으로 일할 수 있는 직업을 선호한다.\n② 변호사 등 전문직을 선택한 이유는 시간 여유가 있기 때문이다.\n③ 시대가 변해도 사람들이 가지고 싶어 하는 직업은 변하지 않는다.\n④ 요즘에는 IT 개발자보다 교사가 되고 싶어 하는 사람들이 더 많다." },
                { type: "읽기", title: "3. 다음을 순서대로 맞게 나열한 것을 고르세요.", passage: "(가) 외식의 장점은 자기가 원하는 음식을 편하게 먹을 수 있다는 것이다.\n(나) 또한 식당의 음식은 양도 많아서 외식을 하면 과식을 할 수밖에 없다.\n(다) 하지만 식당에서 파는 음식들은 짜고 달거나 기름진 메뉴가 대부분이다.\n(라) 기름진 음식을 과식하다 보면 비만이 될 수 있어서 외식을 줄이는 것이 좋다.", q: "① (가)-(나)-(라)-(다)\n② (가)-(다)-(나)-(라)\n③ (라)-(나)-(다)-(가)\n④ (라)-(다)-(가)-(나)" },
                { type: "읽기", title: "4. 다음 글에서 보기의 문장이 들어가기에 가장 알맞은 곳을 고르세요.", passage: "잘못된 식습관과 운동 부족 때문에 당뇨병으로 고생하는 사람들이 많다. ( ㉠ ) 또한 자주 피곤함을 느낄 뿐만 아니라 체중도 감소한다. ( ㉡ ) 당뇨병에 걸리지 않으려면 고기, 생선 같은 육류와 채소, 과일 등을 골고루 먹어야 한다. ( ㉢ ) 특히 후식으로 단 음식을 자주 먹으면 당뇨병에 쉽게 걸릴 수 있기 때문에 이런 습관은 버리는 것이 좋다. ( ㉣ ) 마지막으로 매일 가벼운 운동을 한다면 당뇨병을 예방할 수 있을 것이다.\n\n[보기] 당뇨병에 걸리면 목이 자주 마르고 많이 먹어도 배가 고프다고 느낀다.", q: "① ㉠   ② ㉡   ③ ㉢   ④ ㉣" },
                { type: "읽기", title: "5. 빈칸에 들어갈 말로 알맞게 연결된 것을 고르세요.", passage: "학생은 꼭 학교에 다녀야 한다는 주장에 대해 반대하는 의견도 많다. 집에서 공부할 때의 장점은 학생의 특성이나 수준에 맞는 교육을 할 수 있다는 것이다. ( ㉮ ) 음악에 소질이 있는 학생은 소질을 계발할 수 있는 음악 수업을 들으면 자신의 능력을 더 발전시킬 수 있다. 학교에서는 모두 같은 내용의 수업을 듣기 때문에 자신의 소질과 장점을 잘 살리기 어렵다.\n\n학교 수업은 보통 중간 정도 실력을 가진 학생들에게 맞춰져 있다. 그래서 수준이 높은 학생들은 실력을 키우기가 어렵다. ( ㉯ ) 실력이 부족한 학생은 자신의 수준보다 어려운 수업을 들어서 학업에 대한 흥미가 떨어질 수 있다.", q: "① 또한 - 하지만\n② 하지만 - 그래서\n③ 그래서 - 예를 들면\n④ 예를 들면 - 또한" },
                { type: "읽기", title: "6. 다음 글의 주제로 가장 알맞은 것을 고르세요.", passage: "최근에 채식을 하는 사람들이 늘고 있다. 채식에는 여러 종류가 있지만 보통 고기를 먹지 않고 채소, 과일, 곡물 등만을 먹는 것을 채식이라고 한다. 많은 사람들이 채식을 하는 이유는 다음과 같다. 첫째 채식을 하면 건강이 좋아진다. 채식을 하다 보면 혈압이 낮아지고 당뇨병 증상이 나아질 수 있다. 다음으로 환경에 긍정적인 영향을 줄 수 있다. 고기를 생산하기 위해서 환경을 파괴하는 경우가 많기 때문이다. 이처럼 채식을 하면 건강과 환경적 측면에서 긍정적인 결과를 얻을 수 있어서 앞으로 채식을 하는 사람은 더 늘 것으로 보인다.", q: "① 채식의 종류\n② 채식의 방법\n③ 채식의 단점\n④ 채식의 장점" },
                { type: "읽기", title: "7. 다음을 읽고 일치하지 않는 것을 고르세요.", passage: "예전에는 성인이 되어 결혼을 하는 것, 죽은 뒤에 제사를 지내는 것 등을 중요하게 생각했다. 모두 다 중요하지만 그중 결혼은 특별한 의미를 가지기 때문에 반드시 해야 하는 것으로 생각됐다. 그런데 최근 결혼에 대한 사고방식이 변화하고 있다. 결혼을 꼭 해야 한다는 것이 일반적인 생각이었는데 이제는 결혼은 필수가 아니라고 생각하는 사람들도 많아졌다. 결혼을 하지 않고 산다는 의미의 비혼이라는 말도 자주 쓰이게 됐다. 또한 예전에는 이혼이나 재혼을 비공개적으로 하는 사람들이 많았다. 그러나 사회가 변하고 사고방식이 변화해서 다양한 생각을 받아들일 수 있는 분위기가 만들어졌다. 이제는 결혼과 관련된 개인의 선택이 존중받아야 할 때이다.", q: "① 예전에 결혼은 특별한 의미를 가졌다.\n② 최근 비혼이라는 말이 자주 사용되고 있다.\n③ 전에는 재혼한 사실을 숨기는 사람이 많았다.\n④ 요즘 결혼이 필수라고 생각하는 사람이 늘었다." },
                { type: "읽기", title: "8. 앞의 글의 중심 생각으로 가장 알맞은 것을 고르세요.", passage: "", q: "① 이혼한 것을 공개하는 것이 중요하다.\n② 결혼에 대한 개인의 선택을 존중해야 한다.\n③ 결혼은 사회를 유지하기 위해 꼭 필요하다.\n④ 현대에도 전통적인 사고방식을 지켜야 한다." },
                { type: "읽기", title: "9. 다음을 읽고 빈칸에 들어갈 내용으로 알맞은 것을 고르세요.", passage: "몇 년 동안 계속 같은 일을 하다가 보면 성격뿐만 아니라 건강도 영향을 받을 수 있다. 예를 들면 사무실에 앉아서 하루 종일 컴퓨터를 하는 사람들은 안구 건조증이나, 손목을 움직일 수 없을 정도로 통증을 느끼는 손목 터널 증후군에 걸리기도 한다. 또한 소방관들은 불이 나면 바로 출동해야 하기 때문에 식사 시간이 (       ) 수밖에 없다. 그래서 위염에 자주 걸린다. 이렇게 특정한 직업을 가진 사람들이 걸리기 쉬운 병을 직업병이라고 한다. 직업병은 그 일을 하는 사람들이 공통적으로 가진 병이기 때문에 원인을 찾아내기는 쉽지만 항상 그 일을 할 수밖에 없기 때문에 예방하기는 쉽지 않다. 그래서 증상이 나타나면 심해지지 않도록 증상을 줄이기 위한 노력을 해야 한다.", q: "① 괴로울\n② 불규칙할\n③ 실망스러울\n④ 불만족스러울" },
                { type: "읽기", title: "10. 앞의 글의 제목으로 가장 알맞은 것을 고르세요.", passage: "", q: "① 성격과 직업의 관계\n② 직업병의 원인과 예\n③ 안구건조증의 치료 방법\n④ 컴퓨터가 건강에 주는 영향" },
                { type: "쓰기", title: "1. 공통으로 들어갈 말을 골라서 알맞게 써 보세요.", bank: "[보기]\n빠지다   생기다   끼치다   살리다", q: "1) 백신이 개발된 덕분에 많은 사람들의 생명을 (        ) 수 있었다.\n   나는 언어에 소질이 있다는 말을 자주 들었다. 이런 소질을 (        ) 번역가가 되고 싶다." },
                { type: "쓰기", title: "1. 공통으로 들어갈 말을 골라서 알맞게 써 보세요.", bank: "[보기]\n빠지다   생기다   끼치다   살리다", q: "2) 대회에 나가기 위해 팔이 (        ) 정도로 열심히 춤 연습을 했다.\n   어제 한자 수업을 신청했는데 신청자 명단에 내 이름이 (        ) 있었다. 사무실에 문의해 봐야겠다." },
                { type: "쓰기", title: "1. 공통으로 들어갈 말을 골라서 알맞게 써 보세요.", bank: "[보기]\n빠지다   생기다   끼치다   살리다", q: "3) 작가의 경험은 소설을 쓰는 데에 큰 영향을 (        ) 수밖에 없다.\n   공사 중이니 다른 길로 가시기 바랍니다. 불편을 (        ) 드려서 죄송합니다." },
                { type: "쓰기", title: "1. 공통으로 들어갈 말을 골라서 알맞게 써 보세요.", bank: "[보기]\n빠지다   생기다   끼치다   살리다", q: "4) 처음에는 일이 익숙하지 않았지만 여러 번 하다 보니까 자신감이 (        ).\n   초콜릿을 매일 먹는데 며칠 전부터 이가 너무 아프다. 아무래도 충치가 (        ) 것 같다." },
                { type: "쓰기", title: "2. 알맞은 말을 골라서 대화를 완성해 보세요.", bank: "[보기]\n창의적이다   비현실적이다   비전문적이다\n괴롭다   만족스럽다   실망스럽다", q: "1) 가: 민우 씨, 어제 서울대 축구팀이 한국대 팀한테 졌다면서요?\n나: 네. 당연히 이길 줄 알았는데 지고 말았어요. 기대를 많이 해서 그런지 정말 (        )." },
                { type: "쓰기", title: "2. 알맞은 말을 골라서 대화를 완성해 보세요.", bank: "[보기]\n창의적이다   비현실적이다   비전문적이다\n괴롭다   만족스럽다   실망스럽다", q: "2) 가: 어디가 불편하신가요?\n나: 요즘 새벽만 되면 기침을 너무 심하게 해요. 숨을 쉬기 어려울 정도로 (        ) 힘들어요." },
                { type: "쓰기", title: "2. 알맞은 말을 골라서 대화를 완성해 보세요.", bank: "[보기]\n창의적이다   비현실적이다   비전문적이다\n괴롭다   만족스럽다   실망스럽다", q: "3) 가: 와, 이 그림은 정말 (        ) 것 같아.\n나: 맞아. 지금까지 이런 그림은 본 적이 없어. 사람들의 표정을 신선하고 새롭게 표현했는걸." },
                { type: "쓰기", title: "2. 알맞은 말을 골라서 대화를 완성해 보세요.", bank: "[보기]\n창의적이다   비현실적이다   비전문적이다\n괴롭다   만족스럽다   실망스럽다", q: "4) 가: 주인공이 조선 시대로 가서 현대 의료 기술로 사람들을 치료해 주는 이야기래.\n나: 너무 말이 안 되는 것 같아서 별로였어. 나는 (        ) 이야기를 별로 좋아하지 않거든." },

                { type: "말하기", title: "2. 어휘를 사용해서 이야기해 보세요.", q: "1) 여러분 나라의 기후를 소개해 보세요.\n• 여러분 나라에는 어떤 계절이 있습니까?\n• 그 계절은 날씨가 어떻습니까?\n• 최근 날씨나 기후에 달라진 점이 있습니까?\n\n2) 한국의 여행지에 대해서 이야기해 보세요.\n• 한국에서 여행을 한 적이 있습니까?\n• 여행지에서 어떤 기분을 느꼈습니까?\n• 여러분 나라의 여행지와 한국의 여행지에 공통점이나 차이점이 있습니까?\n\n3) 여러분이 본 공연이나 축제에 대해 소개해 보세요.\n• 기억에 남는 공연이나 축제가 있습니까?\n• 언제 어디에서 봤습니까?\n• 어떤 점이 좋았습니까?" },
                { type: "말하기", title: "3. 친구의 풍경 묘사를 듣고 그림으로 그려 보세요.", q: "1) 여행한 곳 중 소개하고 싶은 곳을 정합니다.\n2) 그곳에서 찍은 사진 중에 마음에 드는 것을 골라서 풍경을 묘사해 보세요.\n3) 친구의 풍경 묘사를 듣고 그림으로 그려 보세요.\n4) 풍경을 묘사한 사진과 풍경 묘사를 듣고 그린 그림을 서로 비교해 보세요." },
                { type: "문법", title: "4. 문법과 표현의 의미를 확인해 보세요.", q: "V-는다더라고(요), A-다더라고(요), N(이)라더라고(요)\n가: 주말에 놀러 가기로 했는데 날씨가 괜찮을까요?\n나: 아까 일기 예보를 봤는데 쌀쌀하다더라고요.\n\nV-는 바람에\n가: 내일 시험 보지요? 공부 많이 했어요?\n나: 아니요. 감기에 걸리는 바람에 하나도 못 했어요.\n\nN을/를 비롯해(서), N을/를 비롯한\n추석에는 송편을 비롯해서 갈비찜, 잡채처럼 평소에 먹기 힘든 명절 음식을 먹는다.\n\nV-는 반면(에), A-(으)ㄴ 반면(에), N인 반면(에)\n여름에는 강수량이 많은 반면에 겨울에는 강수량이 적고 건조한 편이다.\n\nN(이)면 N(이)면\n가: 산과 바다를 모두 보고 싶은데 어디로 가야 할까요?\n나: 속초에 가 보세요. 산이면 산 바다면 바다, 모두 멋져요.\n\n어찌나 V-는지, 어찌나 A-(으)ㄴ지, 어찌나 N인지\n가: 테오 씨는 노래를 정말 잘하네요.\n나: 그렇죠? 어찌나 노래를 잘하는지 가수인 줄 알았어요.\n\nV-는 듯하다, A-(으)ㄴ 듯하다, N인 듯하다\n하늘이 잔뜩 흐린 것을 보니 비가 올 듯하다.\n\nV/A-으며, N이며\n그 가게에서 파는 물건은 값이 저렴하며 품질도 좋아서 인기가 많다.\n\nV/A-던데(요), N(이)던데(요)\n가: 재미있는 영화가 있던데 같이 보러 갈래요?\n나: 그래요? 영화 제목이 뭐예요?\n\nV-는다고 보다, A-다고 보다, N(이)라고 보다\n가: 어렸을 때부터 외국어를 배우는 게 좋다고 들었어요.\n나: 글쎄요. 저는 모국어를 잘하게 된 후에 배우는 게 좋다고 봐요.\n\n여간 V-는 것이 아니다, 여간 A-(으)ㄴ 것이 아니다, 여간 N인 것이 아니다, 여간 V/A-지 않다\n한국말을 배운 지 1년이나 됐지만 상황에 맞게 존댓말을 쓰는 게 여간 어려운 것이 아니다.\n\nN(이)야말로\n인생에서 중요한 사람들이 많지만 가족이야말로 가장 소중한 존재라고 생각한다." },
                { type: "말하기", title: "5. 문법과 표현을 사용해서 이야기해 보세요. (가형)", bank: "[사용 문법/표현]\n1) V-는 바람에   2) 어찌나 V-는지   3) N을/를 비롯해(서)\n4) V-는다고 보다   5) V-는다더라고(요), A-다더라고(요)   6) N(이)면 N(이)면", q: "1) 모임에 꼭 온다고 해서 기다렸는데 왜 안 왔어요?\n2) 과식을 해서 고생한 적이 있었어요?\n3) 고향 음식 중 유명한 음식은 무엇입니까?\n4) 월급은 많지만 적성에 안 맞는 일을 하는 것에 대해 어떻게 생각해요?\n5) 일기 예보를 봤어요? 오늘 날씨가 어떻대요?\n6) 제주도로 여행을 다녀왔다면서요? 어땠어요?" },

                { type: "듣기", title: "1. 뉴스를 듣고 알맞은 그래프를 고르세요.", q: "① 여행 계획이 있는가? [해외여행 67.4% / 국내 여행 24.8% / 계획 없음 7.8%]\n② 여행 계획이 있는가? [국내 여행 67.4% / 계획 없음 24.8% / 해외여행 7.8%]\n③ 국내 여행지 중 선호하는 지역 [제주도 33.3%, 부산 19.0%, 강원도 15.9%, 경상도 7.4%]\n④ 국내 여행지 중 선호하는 지역 [강원도 33.3%, 제주도 19.0%, 경상도 15.9%, 부산 7.4%]" },
                { type: "듣기", title: "2. 대화가 끝난 후 여자가 이어서 할 행동으로 가장 알맞은 것을 고르세요.", q: "① 텔레비전을 켠다.\n② 우산을 사러 간다.\n③ 메시지를 확인한다.\n④ 남자에게 날씨를 알려 준다." },
                { type: "듣기", title: "3. 대화가 끝난 후 남자가 이어서 할 행동으로 가장 알맞은 것을 고르세요.", q: "① 업체에 연락한다.\n② 영상을 편집한다.\n③ 여자에게 이메일을 보낸다.\n④ 부장님께 홍보 책자를 드린다." },
                { type: "듣기", title: "4. 인터뷰를 듣고 남자의 생각으로 가장 알맞은 것을 고르세요.", q: "① 몸이 힘들어서 농사를 포기하고 싶다.\n② 색다른 과일을 키울 수 있어서 자랑스럽다.\n③ 한국에서 열대 과일을 재배하는 것은 불가능하다.\n④ 신안에서 사과와 배 같은 과일을 재배하는 것이 좋다." },
                { type: "듣기", title: "5. 다음을 듣고 들은 내용과 같은 것을 고르세요.", q: "① 여자는 전에 안동에 여행 온 적이 있다.\n② 여자는 안동의 분위기와 음식을 마음에 들어 한다.\n③ 남자는 여행 오기 전에 미리 탈춤에 대해 공부했다.\n④ 남자는 안동 축제가 다른 축제와 비슷하다고 생각한다." },
                { type: "듣기", title: "6. 다음을 듣고 들은 내용과 같은 것을 고르세요.", q: "① 이 대회는 7월 1일에 열린다.\n② 대회에는 세 가지 코스가 있다.\n③ 보령 시민은 참가비가 무료이다.\n④ 우승자는 머드 축제에 참여할 수 있다." },
                { type: "듣기", title: "7. 두 사람은 무엇에 대해 이야기하고 있습니까?", q: "① 공연을 보는 방식\n② 콘서트 일정과 푯값\n③ 콘서트 표를 예매하는 방법\n④ 공연을 하는 가수의 노래 실력" },
                { type: "듣기", title: "8. 남자의 생각으로 가장 알맞은 것을 고르세요.", q: "① 가수의 콘서트 푯값이 너무 비싸서 문제이다.\n② 좋은 자리에서 공연을 보려면 예매를 일찍 해야 한다.\n③ 공연장에서 노래를 따라 부르면 스트레스를 풀 수 있다.\n④ 먼 자리에서 공연을 보는 것보다 비대면으로 보는 게 낫다." },
                { type: "듣기", title: "9. 이 강연의 주제로 알맞은 것을 고르세요.", q: "① 각 지역 특산물의 종류\n② 제사 음식의 역사적 변화\n③ 지역별 제사 음식의 특징\n④ 생소한 음식과 친숙한 음식" },
                { type: "듣기", title: "10. 들은 내용과 일치하는 것을 고르세요.", q: "① 안동의 양반집에서는 제사상에 비빔밥을 올린다.\n② 강릉에서는 화려한 모양으로 제사 음식을 만든다.\n③ 서울과 경기도 지역의 제사 음식은 종류가 다르다.\n④ 전라도에서는 제사 음식 재료로 주로 고기를 활용한다." },
                { type: "읽기", title: "1. 다음 글의 내용과 같은 것을 고르세요.", passage: "아리랑과 함께하는 수요일\n• 일시: 매월 마지막 주 수요일 오전 11시\n• 장소: 한국국악원\n• 내용: 지역별 아리랑을 감상하고 배울 수 있음\n• 참가비: 10,000원 (6인 이상 단체 30% 할인)\n• 공연 선물: 관객 전원에게 공연 후 전통 차와 떡 제공", q: "① 이 공연은 매주 수요일 오전 11시에 진행된다.\n② 관객들은 공연을 보면서 전통 차를 마실 수 있다.\n③ 다섯 명이 함께 참가하는 경우 1인당 만 원씩 내야 한다.\n④ 공연마다 모든 지역의 아리랑을 감상하고 배울 수 있다." },
                { type: "읽기", title: "2. 다음 글의 내용과 같은 것을 고르세요.", passage: "요즘 주말을 이용해 국내 여행을 하는 사람들이 많아지면서 여수가 많은 관광객들의 사랑을 받고 있다. 여수는 산이면 산 바다면 바다, 모두 아름다울 뿐만 아니라 볼거리와 즐길 거리가 다양해서 인기 있는 여행지로 떠오르고 있다. 또한 서울에서 기차로 세 시간이면 갈 수 있다. 기차역 근처에는 대형 수족관과 엑스포 공원이 있어서 아이와 함께 여행을 하는 사람들이 구경하기 좋다. 여수 돌산대교에서 해상 케이블카를 타면 끝없이 펼쳐진 바다를 비롯한 여수의 풍경을 한눈에 볼 수 있다. 케이블카 표를 인터넷에서 미리 예매할 경우 할인을 받을 수 있다. 하지만 예매한 표는 예매한 다음 날부터 사용할 수 있다.", q: "① 여수 해상 케이블카 표를 싸게 살 수 있는 방법은 없다.\n② 여수 기차역 근처에서는 다양한 구경거리를 즐길 수 있다.\n③ 여수가 여행지로 인기 있는 이유는 서울 근처에 있기 때문이다.\n④ 여수에 가면 바다의 풍경을 즐길 수 있지만 산은 찾아보기 힘들다." },
                { type: "읽기", title: "3. 다음을 순서대로 맞게 나열한 것을 고르세요.", passage: "(가) 집의 구조와 형태는 그 지역의 기후와 깊은 관계가 있다.\n(나) 이처럼 집을 짓는 곳의 기후는 집의 구조와 형태에 큰 영향을 준다는 것을 알 수 있다.\n(다) 왜냐하면 제주도는 바람이 매우 심하게 불 뿐만 아니라 태풍의 영향도 자주 받기 때문이다.\n(라) 제주도에서는 집을 지을 때 돌로 담을 쌓고 지붕이 날아가지 않도록 새끼줄로 단단히 묶는다.", q: "① (가)-(나)-(다)-(라)\n② (가)-(라)-(다)-(나)\n③ (라)-(가)-(다)-(나)\n④ (라)-(나)-(가)-(다)" },
                { type: "읽기", title: "4. 다음 글에서 보기의 문장이 들어가기에 가장 알맞은 곳을 고르세요.", passage: "기분 좋게 뮤지컬 공연을 관람하기 위해서는 꼭 지켜야 하는 규칙이 몇 가지 있다. ( ㉠ ) 먼저 휴대폰은 공연이 시작되기 전에 반드시 꺼 놓아야 한다. ( ㉡ ) 하지만 휴대폰에서 나오는 불빛은 공연하는 사람들에게 방해가 된다. ( ㉢ ) 공연을 볼 때 반짝거리는 옷을 입는 것도 휴대폰 불빛처럼 다른 관객들에게 불편을 줄 수 있다. ( ㉣ ) 마지막으로 공연의 흐름이 끊길 수도 있기 때문에 아무 때나 박수를 치면 안 된다. 이와 같이 주변 사람들을 조금만 배려하면 기분 좋게 공연을 관람할 수 있을 것이다.\n\n[보기] 휴대폰을 무음으로 바꾸면 켜 놓아도 괜찮다고 생각하는 사람이 있다.", q: "① ㉠   ② ㉡   ③ ㉢   ④ ㉣" },
                { type: "읽기", title: "5. 빈칸에 들어갈 말로 알맞게 연결된 것을 고르세요.", passage: "날씨가 더워지고 기온이 올라가면 야외 활동을 할 때 주의해야 한다. 햇볕이 뜨거울 때 바깥에 오래 있으면 체온이 올라가면서 머리가 아프거나 어지러울 수 있기 때문이다. 심하면 토할 것 같은 느낌도 들 수 있는데 이런 증상이 나타나는 것을 일사병이라고 한다. 이런 증상이 나타나면 시원한 곳에서 땀을 식히고 체온을 낮추는 것이 중요하다. ( ㉮ ) 땀을 흘린 만큼 물을 충분히 마셔서 몸에 수분이 부족하지 않게 해야 한다. ( ㉯ ) 더위가 심한 날 꼭 야외 활동을 해야 한다면 되도록 오후 3시 이후에 하는 것이 좋으며 꽉 끼는 옷보다는 헐렁한 옷을 입고 모자나 선글라스를 쓰는 것이 도움이 된다.", q: "① 또한 - 만약\n② 하지만 - 또한\n③ 예를 들면 - 반면에\n④ 왜냐하면 - 예를 들면" },
                { type: "읽기", title: "6. 다음 글의 주제로 가장 알맞은 것을 고르세요.", passage: "여행하는 사람들이 많아지면 여행지의 주민들이 돈을 벌 거라고 생각하지만 현실은 그렇지 않다. 유명한 관광지에서는 현지인이 아닌 선진국의 다국적 회사가 관광 시설을 운영하는 경우가 많기 때문이다. 관광객이 많아져도 수익은 다국적 회사에 돌아간다. 착한 여행이 사람들의 주목을 받는 이유는 이러한 현실이 알려졌기 때문이다. 착한 여행은 주민들에게 도움이 되도록 그 지역 사람들이 운영하는 숙소나 식당을 이용하는 것을 말한다. 앞으로는 현지인들에게 도움을 줄 수 있는 착한 여행을 계획해 보는 것도 좋을 듯하다.", q: "① 착한 여행의 장점\n② 관광지 개발의 목표\n③ 다국적 회사의 홍보 방법\n④ 착한 여행에 대한 주민들의 반응" },
                { type: "읽기", title: "7. 다음을 읽고 일치하지 않는 것을 고르세요.", passage: "한국에서는 안동 탈춤 축제를 비롯해서 지역 이름을 붙인 다양한 축제가 열린다. 영화를 볼 수 있는 영화 축제, 먹을거리를 주제로 하는 음식 축제도 있다. 그런데 축제를 즐기다 보면 다른 축제에서도 비슷한 경험을 한 듯한 느낌이 들 때가 많다. 왜냐하면 그 지역의 독특한 문화나 특산물을 소개하기보다는 반응이 좋았던 축제의 형식과 내용을 따라 하기 때문이다. 내용이 뻔한 공연이나 비슷비슷한 체험, 차이점을 찾기 힘든 먹을거리 등이 국내 지역 축제의 한계로 지적되고 있다. 지역 축제를 살리기 위해서는 그 지역만이 가지고 있는 독특한 문화와 이야기를 들려주어야 한다. 특색이 없는 축제를 계속하다 보면 더 이상 관람객이 찾지 않는 축제가 될 것이다.", q: "① 한국 축제의 먹을거리는 어디나 비슷하다.\n② 안동 탈춤 축제는 지역 이름을 붙인 축제이다.\n③ 국내 지역 축제는 관람객들에게 좋은 반응을 얻고 있다.\n④ 지역 축제에서 하는 공연은 내용이 뻔하다는 평가를 받는다." },
                { type: "읽기", title: "8. 앞 글의 중심 생각으로 가장 알맞은 것을 고르세요.", q: "① 사람들에게 친숙한 지역 축제가 좋은 반응을 얻는다.\n② 지역 축제가 성공하기 위해서는 홍보가 잘 돼야 한다.\n③ 독특한 지역 문화를 보여 주는 축제를 만들어야 한다.\n④ 반응이 좋았던 지역 축제를 따라 해야 성공할 수 있다." },
                { type: "읽기", title: "9. 다음을 읽고 빈칸에 들어갈 내용으로 알맞은 것을 고르세요.", passage: "한국은 사계절이 있으며 계절의 구분이 뚜렷한 편이다. 사계절 중 가을은 뜨거운 여름에서 추운 겨울로 넘어가는 시기이다. 햇빛이 비치는 시간이 줄어들며 날씨도 점점 쌀쌀해진다. 가을과 관련된 한국어 표현 가운데 '가을을 타다'라는 말이 있다. 가을이 되어서 기분이 가라앉고 마음이 우울해질 때 사용하는 말이다. 또한 한국어에는 '봄을 타다'라는 말도 있다. 재미있는 것은 '가을을 타다'와 '봄을 타다'는 자주 사용되는 반면에 '여름을 타다', '겨울을 타다'와 같은 말은 없다는 것이다. 즉, '타다'는 날씨의 변화를 더 쉽게 느낄 수 있는 계절과 함께 쓸 수 있는 표현이다. 이러한 표현을 보면 (       ) 집의 구조나 음식뿐만 아니라 사용하는 말에도 영향을 주고 있음을 확인할 수 있다. 언어를 배울 때 이렇게 그 나라의 날씨나 기후와 관련된 독특한 언어 표현을 찾아보는 것도 의미가 있을 것이다.", q: "① 날씨가\n② 문화가\n③ 기분이\n④ 지형이" },
                { type: "읽기", title: "10. 앞 글의 제목으로 가장 알맞은 것을 고르세요.", q: "① 한국의 가을 날씨\n② 봄과 가을의 차이점\n③ 한국의 사계절과 기후\n④ 계절과 관련된 언어 표현" },
                { type: "쓰기", title: "1. 공통으로 들어갈 말을 골라서 알맞게 써 보세요.", bank: "[보기]\n변덕스럽다   심하다   신선하다   부족하다", q: "1) • 여름에 더위가 (        ) 때는 낮에 외출을 하지 않는 것이 좋다.\n   • 그 아이는 장난이 (        ) 엄마에게 자주 야단을 맞는 듯하다." },
                { type: "쓰기", title: "1. 공통으로 들어갈 말을 골라서 알맞게 써 보세요.", bank: "[보기]\n변덕스럽다   심하다   신선하다   부족하다", q: "2) • 그는 여자 친구의 (        ) 성격 때문에 여간 자주 싸우는 것이 아니다.\n   • 요즘은 날씨가 참 (        ). 아침에는 폭우가 내렸는데 지금은 맑게 개었다." },
                { type: "쓰기", title: "1. 공통으로 들어갈 말을 골라서 알맞게 써 보세요.", bank: "[보기]\n변덕스럽다   심하다   신선하다   부족하다", q: "3) • 시험 결과가 좋지 않을 때에는 자신의 노력이 (        ) 않았는지 생각해 봐야 한다.\n   • 현대인들은 잘못된 식습관과 (        ) 운동량 때문에 비만을 비롯한 다양한 성인병에 걸린다." },
                { type: "쓰기", title: "1. 공통으로 들어갈 말을 골라서 알맞게 써 보세요.", bank: "[보기]\n변덕스럽다   심하다   신선하다   부족하다", q: "4) • 전통시장에 가면 (        ) 채소를 비롯해서 다양한 음식 재료를 살 수 있다.\n   • 이번에 개봉한 영화는 내용이 (        ) 뿐만 아니라 배우들의 연기도 훌륭해서 좋은 반응을 얻고 있다." },
                { type: "쓰기", title: "2. 알맞은 말을 골라서 대화를 완성해 보세요.", bank: "[보기]\n친숙하다   수없이   끝없이   독특하다   가득하다", q: "1) 가: 지난 주말에 벚꽃 축제에 갔다면서? 어땠어?\n나: 말도 마. 길이 사람들로 (        ) 걷기가 힘들 정도였어." },

                { type: "말하기", title: "5. 문법과 표현을 사용해서 이야기해 보세요. (나형)", bank: "[사용 문법/표현]\n1) V-느냐에 따라(서)   2) N에 의하면   3) V/A-을 리가 없다\n4) N만 못하다   5) V-으나 마나   6) V-기는 틀렸다", q: "1) 요즘 방을 구하고 있어요. 방 크기가 비슷한데 가격 차이가 크네요.\n2) _____ 씨 나라의 인구는 몇 명입니까?\n3) 다니엘 씨에게 들었는데 4급 중간시험이 아주 쉽대요.\n4) _____ 씨가 좋아하는 가수의 새 노래가 나왔네요. 노래가 어때요?\n5) 배가 고프면 이 과자라도 좀 먹을래요?\n6) 시간이 없는데 택시 타면 시간 안에 갈 수 있을까요?" },
                { type: "말하기", title: "5. 문법과 표현을 사용해서 이야기해 보세요. (다형)", bank: "[사용 문법/표현]\n1) V-느냐에 따라(서)   2) N에 의하면   3) V/A-을 리가 없다\n4) N만 못하다   5) V-으나 마나   6) V-기는 틀렸다", q: "1) 아르바이트를 하면 한 달에 돈을 얼마나 벌 수 있을까요?\n2) 오늘 비가 올 확률은 몇 %입니까?\n3) 내일부터 학생 식당에서 밥을 무료로 준대요.\n4) 이사했다면서요? 새집으로 이사하니까 좋아요?\n5) 이번에 _____ 씨가 좋아하는 배우가 나오는 영화가 새로 나왔다면서요?\n6) 과제를 아직 시작도 못 했는데 오늘 다 할 수 있을까요?" },
                { type: "듣기", title: "1. 뉴스를 듣고 알맞은 그래프를 고르세요.", q: "① 연령별 커피 선호 비율 [20대: 31.7%, 40대: 36.5%, 60대 이상: 44.9%]\n② 연령별 커피 선호 비율 [20대: 36.5%, 40대: 44.9%, 60대 이상: 31.7%]\n③ 한국의 커피 수입량 (단위: 톤) [2015 ➔ 2018 감소 ➔ 2021 증가 (V자형)]\n④ 한국의 커피 수입량 (단위: 톤) [2015 ➔ 2018 ➔ 2021 지속 감소 (하향선)]" },
                { type: "듣기", title: "2. 대화가 끝난 후 남자가 이어서 할 행동으로 가장 알맞은 것을 고르세요.", q: "① 콘서트에 간다.\n② 표를 취소한다.\n③ 피시방에 간다.\n④ 인터넷 속도를 확인한다." },
                { type: "듣기", title: "3. 대화가 끝난 후 여자가 이어서 할 행동으로 가장 알맞은 것을 고르세요.", q: "① 역무원을 부른다.\n② 기계에 카드를 넣는다.\n③ 출입문에 카드를 댄다.\n④ 일회용 교통카드를 산다." },
                { type: "듣기", title: "4. 강연을 듣고 남자의 생각으로 가장 알맞은 것을 고르세요.", q: "① 개인 방송으로는 시청자와 소통하기 어렵다.\n② 개인 방송의 내용이 사실인지 확인해 봐야 한다.\n③ 텔레비전이 사람들에게 미치는 영향력이 점점 커질 것이다.\n④ 기존 방송 매체는 사람들의 관심을 끌기 위해 노력해야 한다." },
                { type: "듣기", title: "5. 다음을 듣고 들은 내용과 같은 것을 고르세요.", q: "① 여자는 경기를 하다가 부상을 당했다.\n② 여자는 남자와 함께 배드민턴을 칠 것이다.\n③ 남자가 응원하는 선수는 오늘 결승 경기를 한다.\n④ 남자는 자신이 응원하는 선수가 질 거라고 생각한다." },
                { type: "듣기", title: "6. 다음을 듣고 들은 내용과 같은 것을 고르세요.", q: "① 나이와 상관없이 운동의 효과는 비슷하다.\n② 20대는 온몸을 사용할 수 있는 운동을 하는 게 좋다.\n③ 40대는 의자나 벽을 잡고 운동하는 것이 효과적이다.\n④ 60대 이상의 경우 매일 운동하는 것은 건강에 좋지 않다." },
                { type: "듣기", title: "7. 두 사람은 무엇에 대해 이야기하고 있습니까?", q: "① 앞으로의 계획\n② 여자의 수상 경력\n③ 좋은 배우의 조건\n④ 드라마에 출연하게 된 계기" },
                { type: "듣기", title: "8. 들은 내용과 일치하는 것을 고르세요.", q: "① 여자는 영화에 출연해서 신인상을 받았다.\n② 여자는 배우가 된 후에 가수 활동을 하고 있다.\n③ 여자는 처음 출연한 드라마에서 주목을 받았다.\n④ 여자는 선배의 권유로 드라마에 출연하게 되었다." },
                { type: "듣기", title: "9. 스몸비에 대한 설명으로 맞지 않는 것을 고르세요.", q: "① 스마트폰과 좀비를 합친 말이다.\n② 스몸비 때문에 교통사고가 증가했다.\n③ 성인이 이런 행동을 할 경우 벌금을 낸다.\n④ 휴대폰을 보면서 길을 걷는 사람들을 말한다." },
                { type: "듣기", title: "10. 남자의 생각으로 가장 알맞은 것을 고르세요.", q: "① 신호등 주변에 스마트폰 사용을 막는 프로그램을 설치해야 한다.\n② 경찰이 스몸비같이 무책임한 사람들을 잡으면 효과가 있을 것이다.\n③ 바닥 신호등을 설치해서 사람들이 신호를 잘 볼 수 있도록 해야 한다.\n④ 사람들이 길을 걷거나 횡단보도를 건널 때 스마트폰을 사용할 리가 없다." },
                { type: "읽기", title: "1. 다음 글의 내용과 같은 것을 고르세요.", passage: "태권도의 역사\n• 한국에서 처음 시작됐으며 1960년대에 국제적인 스포츠가 됨\n• 1973년에 서울에서 처음으로 세계 태권도 선수권 대회가 열림\n• 2000년에 호주 시드니에서 개최된 올림픽에서 정식 종목이 됨\n• 올림픽에서는 남녀 각각 4체급씩 경기가 치러지며 총 금메달 수는 8개임", q: "① 1960년에 태권도 세계 선수권 대회가 열렸다.\n② 태권도가 올림픽 정식 종목이 된 것은 1973년이다.\n③ 올림픽에서는 남녀 합쳐서 모두 네 번의 경기가 열린다.\n④ 올림픽에서 태권도로 딸 수 있는 금메달의 수는 여덟 개이다." },
                { type: "읽기", title: "2. 다음 글의 내용과 같은 것을 고르세요.", passage: "최근 통계청 발표에 의하면 올해는 작년보다 물가가 4.8% 올랐다고 한다. 이것은 2009년 이후 가장 높은 수치이다. 특히 외식 물가는 지난달에 비해 5.5%나 올랐는데 그중에서도 국민 간식인 치킨 가격은 한 달 사이에 11% 가까이 인상돼서 외식 물가 인상률의 두 배나 오른 셈이다. 이처럼 외식 물가를 비롯한 먹을거리 가격이 오르면서 국민들이 느끼는 경제적 부담도 증가한 것으로 나타났다. 정부에서는 물가를 잡기 위해 여러 대책을 내놓고 있으나 물가가 안정되기까지는 시간이 걸릴 것이라는 전망이다.", q: "① 치킨 가격은 작년보다 두 배 인상됐다.\n② 올해 물가 인상률은 2009년 이후 가장 높다.\n③ 물가를 내리기 위한 정부의 노력이 효과가 있었다.\n④ 작년과 비교해서 외식 물가는 11% 오른 것으로 나타났다." },
                { type: "읽기", title: "3. 다음을 순서대로 맞게 나열한 것을 고르세요.", passage: "(가) 그러나 요즘 팬들은 스타의 사회적 영향력을 높이는 데에도 관심이 많다.\n(나) 예전에는 팬들이 자신이 좋아하는 스타의 모든 것을 알고 싶어 하고 따라다니는 것에 집중했다.\n(다) 이처럼 예전과 다르게 팬들이 스타를 위해 사회적 활동을 한다는 점에서 변화된 팬 문화를 느낄 수 있다.\n(라) 스타의 이름으로 기부를 하거나 봉사활동을 통해서 자신이 좋아하는 스타의 이미지를 긍정적으로 변화시키는 것이 그 예이다.", q: "① (나)-(가)-(라)-(다)\n② (나)-(라)-(다)-(가)\n③ (라)-(가)-(다)-(나)\n④ (라)-(다)-(가)-(나)" },
                { type: "읽기", title: "4. 다음 글에서 보기의 문장이 들어가기에 가장 알맞은 곳을 고르세요.", passage: "핸드볼은 실내에서 하는 7인 스포츠로서 손으로 공을 던져서 상대 팀 골대에 넣는 경기이다. ( ㉠ ) 핸드볼 경기는 전반전과 후반전 각 30분씩 진행되며 경기 종료 후 많이 득점한 팀이 이긴다. ( ㉡ ) 후반전까지 했는데도 무승부이면 연장전을 한다. ( ㉢ ) 연장전은 전반과 후반 각 5분씩 진행되는데 승부가 나지 않으면 2차 연장전을 치른다. ( ㉣ ) 두 팀이 한 번씩 순서대로 다섯 개의 공을 던져서 더 많은 득점을 한 팀이 승리하게 된다.\n\n[보기] 연장전이 모두 끝난 후에도 승부가 나지 않으면 승부 던지기를 하게 된다.", q: "① ㉠   ② ㉡   ③ ㉢   ④ ㉣" },
                { type: "읽기", title: "5. 빈칸에 들어갈 말로 알맞게 연결된 것을 고르세요.", passage: "한국에서는 이삿짐 업체의 전화번호에 숫자 2와 4가 들어가 있는 경우가 많다. 그 숫자의 발음이 '이사'라는 단어와 발음이 같아서 쉽게 기억할 수 있기 때문인 듯하다. 이와 같이 한국에서는 발음 때문에 업체마다 자주 사용하는 전화번호가 있다. ( ㉮ ) 배달업체는 '빨리'라는 말을 떠올리기 쉽도록 전화번호로 '8282'를 선호하고, 중고품을 거래하는 업체들은 '사고 팔고'라는 말과 발음이 비슷한 '4989'를 선호한다. 그리고 '1004(천사)'처럼 좋은 의미를 가진 숫자를 전화번호로 사용하려는 사람들도 많다. ( ㉯ ) 통신 회사에서는 추첨을 통해 이런 번호를 나눠 주기도 한다. 인기 번호는 경쟁률이 2만 대 1이 넘을 정도로 경쟁률이 높다.", q: "① 또한 - 이처럼\n② 그리고 - 반면에\n③ 예를 들면 - 그래서\n④ 왜냐하면 - 그러나" },
                { type: "읽기", title: "6. 다음 글의 주제로 가장 알맞은 것을 고르세요.", passage: "대부분의 운동선수들은 경기에서 지고 싶어 하지 않는다. 이러한 마음이 경기를 더 흥미진진하게 하지만 승부욕 때문에 정정당당하게 경기를 하지 않고 반칙을 하는 선수들도 볼 수 있다. 심한 경우 상대 선수가 다칠 것을 알면서도 밀거나 넘어뜨리는 경우도 있다. 승부가 나지 않는 아슬아슬한 상황에서 반칙을 하면 경기 결과에 큰 영향을 줄 수도 있다. 물론 경기의 승패도 중요하다. 그러나 그것보다는 신체적, 정신적 능력을 키우고 자신의 한계에 도전하는 것에서 의미를 찾아야 한다.", q: "① 운동선수에게 승부욕은 반드시 필요하다.\n② 경기 결과보다 최선을 다하는 것이 중요하다.\n③ 과정이 좋아도 경기에서 지면 아무 소용이 없다.\n④ 일부러 반칙을 한 경우 경고 없이 퇴장시켜야 한다." },
                { type: "읽기", title: "7. 다음을 읽고 일치하는 것을 고르세요.", passage: "최근 '이웃 마켓'이 유행이다. 이웃 마켓은 일종의 열린 장터로서 자신의 근처에 사는 사람들을 대상으로 물건을 판매하는 스마트폰 앱이다. 자신이 팔고 싶은 물건의 사진과 정보를 여기에 올리면 근처에 사는 사람들이 보고 구매하는 방식이다. 이웃 마켓의 장점은 누구나 쉽게 이용할 수 있고 중고품도 거래할 수 있으며 무료 나눔도 가능하다는 것이다. 뿐만 아니라 그 지역에서 할 수 있는 아르바이트도 구할 수 있고 잃어버린 물건을 찾아 주기도 한다.\n\n단점으로는 물건을 직접 사고팔기 때문에 시간이 많이 걸리고 번거롭다는 점, 사고파는 물건의 종류가 적다는 점을 꼽을 수 있다. 이런 단점에도 불구하고 이웃 마켓을 이용하는 이유는 이웃 간의 소통이 예전만 못하다는 사람들이 많은데, 이웃 마켓을 통해서 주변 사람들과 교류하고 정을 나눌 수 있기 때문인 듯하다.", q: "① 이웃 마켓은 전화를 통해서도 이용할 수 있다.\n② 이웃 마켓에서는 쓰던 물건만 거래할 수 있다.\n③ 이웃 마켓에서는 원하는 모든 물건을 살 수 있다.\n④ 이웃 마켓을 통해 아르바이트할 사람을 구할 수 있다." },
                { type: "읽기", title: "8. 앞 글에서 다루지 않은 내용은 무엇입니까?", q: "① 이웃 마켓의 장점\n② 이웃 마켓의 단점\n③ 이웃 마켓의 사용 연령\n④ 이웃 마켓의 사용 방법" },
                { type: "읽기", title: "9. 다음을 읽고 빈칸에 들어갈 내용으로 알맞은 것을 고르세요.", passage: "프로 스포츠가 사람들에게 인기를 끌면서 스포츠 선수들의 인기도 높아지고 있다. 스포츠 스타의 인기는 연예인만큼 대단해서 팬클럽이 생길 정도이다. 그래서인지 스포츠 선수들의 경기 모습뿐만 아니라 경기장 밖에서의 행동들도 사람들에게 관심을 받는다. 스포츠 선수들이 경기장 안팎에서 보여 주는 (       ) 행동에 사람들이 주목하는 이유이다. 어떤 스포츠 스타는 음주 운전을 해서 사회적으로 많은 비난을 받았다. 또한 유명 선수들이 선수 생활을 마친 후 방송에 출연해서 연예인으로서 활동을 하는 경우도 심심치 않게 볼 수 있다. 이런 선수들은 광고를 통해 상품을 팔거나 예능에 출연해서 사람들에게 즐거움을 주기도 한다. 이처럼 스포츠 스타들의 영향력이 커졌기 때문에 스포츠 스타들은 운동 실력뿐만 아니라 그에 맞는 인성과 바람직한 태도도 갖추어야 할 것이다.", q: "① 무관심한\n② 무책임한\n③ 무의미한\n④ 무능력한" },

        function downloadPPTX() {
            let btn = document.getElementById('downloadBtn'); let originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 생성 중...'; btn.disabled = true;

            setTimeout(() => {
                try {
                    let pres = new PptxGenJS(); pres.layout = 'LAYOUT_16x9'; 
                    let COLOR_NAVY = "27408B"; let COLOR_BLACK = "000000"; let COLOR_GRAY = "64748B"; let COLOR_BORDER = "CBD5E1";
                    let COLOR_BG_LIGHT = "F8FAFC"; let COLOR_BG_DARK = "E2E8F0"; let FONT_FACE = "맑은 고딕";

                    let X_MARGIN = 0.4; let W_CONTENT = 9.2;

                        slide.addText(txt, { x: X_MARGIN, y: 0.3, w: W_CONTENT, h: 0.4, valign: 'bottom', color: COLOR_NAVY, fontSize: 30, bold: true, fontFace: FONT_FACE });
                        slide.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: 0.75, w: W_CONTENT, h: 0.03, fill: COLOR_NAVY });
                    }

                    let safeTitle = activeKey.replace(/[<>:"\/\\|?*\x00-\x1F]/g, "_");
                    let slide1 = pres.addSlide();
                    
                    if (activeKey === 'review-1-3') {
                        slide1.addText("1~3단원 종합 복습 (Workbook)", { x: 4.0, y: 0.3, w: 5.8, align: 'right', color: COLOR_GRAY, fontSize: 24, bold: true, fontFace: FONT_FACE });
                    } else if (activeKey === 'review-4-6') {
                        slide1.addText("4~6단원 종합 복습 (Workbook)", { x: 4.0, y: 0.3, w: 5.8, align: 'right', color: COLOR_GRAY, fontSize: 24, bold: true, fontFace: FONT_FACE });
                    } else if (activeKey === 'review-7-9') {
                        slide1.addText("7~9단원 종합 복습 (Workbook)", { x: 4.0, y: 0.3, w: 5.8, align: 'right', color: COLOR_GRAY, fontSize: 24, bold: true, fontFace: FONT_FACE });
                    }
                    
                    slide1.addShape(pres.ShapeType.rect, { x: 0, y: 1.9, w: 10, h: 1.2, fill: COLOR_NAVY });
                    slide1.addText("종합 복습", { x: 0, y: 1.9, w: 10, h: 1.2, align: 'center', valign: 'middle', color: "FFFFFF", fontSize: 50, bold: true, fontFace: FONT_FACE });

                    if (activeKey.startsWith('review-')) {
                        let rData = window.reviewDB[activeKey] || [];
                        rData.forEach((item, pIdx) => {
                            // 1. 단어 목록 분리 (isList) - 24pt
                            if (item.isList) {
                                item.content.forEach((unit, uIdx) => {
                                    let slideR = pres.addSlide({ masterName: "MASTER_SLIDE" });
                                    addSlideTitle(slideR, null, item.type);
                                    slideR.addText(item.title, { x: X_MARGIN, y: 0.85, w: W_CONTENT, h: 0.4, color: "1E40AF", fontSize: 24, bold: true, fontFace: FONT_FACE });
                                    
                                    let currentY = 1.35;
                                    slideR.addText(`[${unit.t}]`, { x: X_MARGIN, y: currentY, w: W_CONTENT, h: 0.3, color: "1E40AF", fontSize: 20, bold: true, fontFace: FONT_FACE });
                                    currentY += 0.4;
                                    
                                    let rows = []; let words = unit.words;
                                    for(let i=0; i<words.length; i+=4) {
                                        let r = [];
                                        r.push({ text: `☐ ${words[i]||''}`, options: { fontSize: 24, fontFace: FONT_FACE, border: {pt:1, color: COLOR_BORDER}, align:'left' } });
                                        r.push({ text: words[i+1] ? `☐ ${words[i+1]}` : '', options: { fontSize: 24, fontFace: FONT_FACE, border: {pt:1, color: COLOR_BORDER}, align:'left' } });
                                        r.push({ text: words[i+2] ? `☐ ${words[i+2]}` : '', options: { fontSize: 24, fontFace: FONT_FACE, border: {pt:1, color: COLOR_BORDER}, align:'left' } });
                                        r.push({ text: words[i+3] ? `☐ ${words[i+3]}` : '', options: { fontSize: 24, fontFace: FONT_FACE, border: {pt:1, color: COLOR_BORDER}, align:'left' } });
                                        rows.push(r);
                                    }
                                    
                                    let chunkSize = 7; 
                                    for (let k = 0; k < rows.length; k += chunkSize) {
                                        let chunkRows = rows.slice(k, k + chunkSize);

                                            slideR.addTable(chunkRows, { x: X_MARGIN, y: currentY, w: W_CONTENT, colW: [2.3, 2.3, 2.3, 2.3] });

                                // 2. 문법 의미 확인 파트 (문법별 1페이지씩)
                                let rules = item.q.split('\n\n');

                                    addSlideTitle(slideR, null, item.type);

                                    slideR.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: 1.35, w: W_CONTENT, h: 4.0, fill: COLOR_BG_LIGHT, line: { color: COLOR_BORDER, dashType: 'dash', width: 2 } });
                                    
                                    let ruleLines = rule.split('\n');
                                    let formattedRuleName = ruleLines[0].replace(/동-/g, 'V-').replace(/형-/g, 'A-').replace(/명/g, 'N');
                                    let formattedRuleDesc = ruleLines.slice(1).join('\n');
                                    
                                    let textConfig = [
                                        { text: formattedRuleName + "\n", options: { color: "0055FF", bold: true, fontSize: 24 } },
                                        { text: formattedRuleDesc, options: { color: COLOR_BLACK, bold: false, fontSize: 24 } }
                                    ];
                                    slideR.addText(textConfig, { x: 0.6, y: 1.45, w: 8.8, h: 3.8, valign: 'middle', align: 'left', lineSpacing: 40, wrap: true });
                                });
                            } else if (item.type === "발음") {
                                // 3. 발음 항목 분리
                                let pParts = item.q.split('\n\n');
                                pParts.forEach((pPart) => {
                                    let slideR = pres.addSlide({ masterName: "MASTER_SLIDE" });
                                    addSlideTitle(slideR, null, item.type);
                                    slideR.addText(item.title, { x: X_MARGIN, y: 0.85, w: W_CONTENT, h: 0.4, color: "1E40AF", fontSize: 24, bold: true, fontFace: FONT_FACE });
                                    slideR.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: 1.35, w: W_CONTENT, h: 4.0, fill: COLOR_BG_LIGHT, line: { color: COLOR_BORDER, dashType: 'dash', width: 2 } });
                                    slideR.addText(pPart, { x: 0.6, y: 1.45, w: 8.8, h: 3.8, color: COLOR_BLACK, fontSize: 20, fontFace: FONT_FACE, valign: 'middle', align: 'left', lineSpacing: 40, wrap: true });
                                });
                            } else {
                                // 일반 듣기, 읽기, 쓰기, 기타 말하기 (지문과 문제 완전 분리)
                                let bankTxt = getText(`review-${pIdx}-bank`) || (item.bank ? item.bank : "");
                                let passageStr = item.passage ? item.passage : "";
                                let qTxt = getText(`review-content-${pIdx}`) || (item.q ? item.q : "");
                                
                                // 지문(passage)이 있는 경우 먼저 지문 슬라이드 생성
                                if (passageStr && passageStr.trim() !== "") {
                                    let MAX_CHARS_PASSAGE = 450;
                                    let textParts = [];
                                    let sentences = passageStr.split('\n');
                                    let currentPart = "";
                                    for(let i=0; i<sentences.length; i++) {
                                        if(currentPart.length + sentences[i].length > MAX_CHARS_PASSAGE) {
                                            textParts.push(currentPart);
                                            currentPart = sentences[i] + "\n";
                                        } else {
                                            currentPart += sentences[i] + "\n";
                                        }
                                    }
                                    if(currentPart) textParts.push(currentPart);

                                    textParts.forEach((part, partIdx) => {
                                        let slideP = pres.addSlide({ masterName: "MASTER_SLIDE" });
                                        addSlideTitle(slideP, null, item.type);
                                        slideP.addText(item.title + (textParts.length > 1 ? ` [지문 ${partIdx+1}]` : " [지문]"), { x: X_MARGIN, y: 0.85, w: W_CONTENT, h: 0.4, color: "1E40AF", fontSize: 24, bold: true, fontFace: FONT_FACE });
                                        
                                        let currentY = 1.35; let remainingHeight = 4.0;
                                        slideP.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: currentY, w: W_CONTENT, h: remainingHeight, fill: COLOR_BG_LIGHT, line: { color: COLOR_BORDER, dashType: 'dash', width: 2 } });
                                        slideP.addText(part, { x: 0.5, y: currentY + 0.1, w: 9.0, h: remainingHeight - 0.2, color: COLOR_BLACK, fontSize: 20, fontFace: FONT_FACE, valign: 'top', lineSpacing: 30, wrap: true });
                                    });
                                }

                                // 그 다음 문제(qTxt) 슬라이드 생성
                                if (qTxt && qTxt.trim() !== "") {
                                    let MAX_CHARS_Q = 450;
                                    let qParts = [];
                                    let qSentences = qTxt.split('\n');
                                    let currentQPart = "";
                                    for(let i=0; i<qSentences.length; i++) {
                                        if(currentQPart.length + qSentences[i].length > MAX_CHARS_Q) {
                                            qParts.push(currentQPart);
                                            currentQPart = qSentences[i] + "\n";
                                        } else {
                                            currentQPart += qSentences[i] + "\n";
                                        }
                                    }
                                    if(currentQPart) qParts.push(currentQPart);

                                    qParts.forEach((part, partIdx) => {
                                        let slideQ = pres.addSlide({ masterName: "MASTER_SLIDE" });
                                        addSlideTitle(slideQ, null, item.type);
                                        // 지문이 있었으면 [문제] 꼬리표 추가
                                        let qTitle = item.title + (passageStr ? " [문제]" : "") + (qParts.length > 1 ? ` (${partIdx+1})` : "");
                                        slideQ.addText(qTitle, { x: X_MARGIN, y: 0.85, w: W_CONTENT, h: 0.4, color: "1E40AF", fontSize: 24, bold: true, fontFace: FONT_FACE });
                                        
                                        let currentY = 1.35; let remainingHeight = 4.0;
                                        if (bankTxt && bankTxt.trim() !== "" && partIdx === 0) {
                                            slideQ.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: currentY, w: W_CONTENT, h: 1.2, fill: COLOR_BG_DARK, line: { color: COLOR_BORDER, width: 1 } });
                                            slideQ.addText(bankTxt, { x: 0.5, y: currentY + 0.1, w: 9.0, h: 1.0, color: COLOR_BLACK, fontSize: 18, fontFace: FONT_FACE, align: 'center', valign: 'middle', bold: true });
                                            currentY += 1.3; remainingHeight -= 1.3;
                                        }
                                        slideQ.addShape(pres.ShapeType.rect, { x: X_MARGIN, y: currentY, w: W_CONTENT, h: remainingHeight, fill: COLOR_BG_LIGHT, line: { color: COLOR_BORDER, dashType: 'dash', width: 2 } });
                                        slideQ.addText(part, { x: 0.5, y: currentY + 0.1, w: 9.0, h: remainingHeight - 0.2, color: COLOR_BLACK, fontSize: 20, fontFace: FONT_FACE, valign: 'top', lineSpacing: 30, wrap: true });
                                    });
                                }
                            }
                        });
                    }

                    pres.writeFile({ fileName: `서울대_한국어_4A_${safeTitle}.pptx` }).then(() => {
                        btn.innerHTML = '<i class="fa-solid fa-check"></i> 다운로드 완료';
                        showModal("🎉 PPTX 파일 다운로드가 완료되었습니다.");
                        setTimeout(() => { btn.innerHTML = originalText; btn.disabled = false; }, 3000);
                    });
                } catch(e) { showModal("❌ 오류 발생: " + e.message); btn.innerHTML = originalText; btn.disabled = false; }
            }, 100);
        }
    </script>
</body>
</html>
